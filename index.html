<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piggy Chef</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            font-family: 'Jersey 10', -apple-system, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            padding: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            font-size: 20px;
            line-height: 1.2;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        .header { text-align: center; margin-bottom: 16px; }
        .header h1 {
            font-size: 38px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .header .username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 18px;
        }

        .balance-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
            font-size: 20px;
        }
        .balance-bar .balance {
            color: #27ae60; font-size: 24px;
        }

        .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
        .tab {
            flex: 1; padding: 10px 6px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            border: none; border-radius: 8px; font-size: 20px; cursor: pointer;
            font-family: inherit;
        }
        .tab.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 16px; margin-bottom: 12px;
        }
        .card .label {
            font-size: 17px; color: var(--tg-theme-hint-color, #999);
            margin-bottom: 6px;
        }
        .card .value { font-size: 30px; }

        .row { display: flex; gap: 12px; margin-bottom: 12px; }
        .row .card { flex: 1; margin-bottom: 0; }

        .loading {
            text-align: center; padding: 40px;
            color: var(--tg-theme-hint-color, #999);
            font-size: 20px;
        }

        .error {
            background: #ff4444; color: white;
            padding: 12px; border-radius: 8px; margin-bottom: 12px;
        }

        button {
            width: 100%; padding: 14px;
            font-size: 20px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 10px; cursor: pointer; margin-top: 8px;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        button:active { opacity: 0.8; }

        /* ИНВЕНТАРЬ */
        .inv-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 10px 14px; margin-bottom: 10px;
            font-size: 19px;
        }
        .inv-header .total-value { color: #27ae60; }

        .sort-bar {
            display: flex; gap: 6px; margin-bottom: 10px;
            overflow-x: auto; padding-bottom: 4px;
        }
        .sort-btn {
            padding: 8px 12px; font-size: 17px;
            border-radius: 8px; border: 1px solid #888;
            background: transparent;
            color: var(--tg-theme-text-color, #000);
            cursor: pointer; white-space: nowrap;
            width: auto; margin: 0;
            font-family: inherit;
        }
        .sort-btn.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border-color: var(--tg-theme-button-color, #2481cc);
        }

        .item {
            display: flex; align-items: center; gap: 12px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 14px; padding: 12px; margin-bottom: 8px;
            transition: background 0.15s;
        }
        .item.selected {
            background: rgba(39, 174, 96, 0.25);
            border: 2px solid #27ae60;
        }

        .item-checkbox {
            width: 28px; height: 28px; border-radius: 8px;
            border: 2px solid #888;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; cursor: pointer; font-size: 22px;
            color: white; background: transparent; transition: all 0.15s;
        }
        .item-checkbox.checked {
            background: #27ae60; border-color: #27ae60;
        }

        .item-checkbox-placeholder {
            width: 28px; height: 28px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }

        .item-img {
            width: 56px; height: 56px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; flex-shrink: 0; overflow: hidden;
        }
        .item-img img { width: 100%; height: 100%; object-fit: contain; }

        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-size: 19px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .item-price { font-size: 17px; color: #27ae60; }
        .item-code {
            font-size: 14px; color: var(--tg-theme-hint-color, #999);
            font-family: monospace;
        }

        .item-actions {
            display: flex; flex-direction: column; gap: 4px;
        }
        .btn-tiny {
            width: 40px; height: 36px; font-size: 20px;
            padding: 0; margin: 0; border-radius: 8px;
            border: none; cursor: pointer; color: white;
            font-family: inherit;
        }
        .btn-tiny-insure { background: #4a90e2; }
        .btn-tiny-gift { background: #e67e22; }
        .btn-tiny-insure.disabled { background: #555; opacity: 0.5; cursor: not-allowed; }

        .inv-pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-top: 14px; margin-bottom: 100px;
        }
        .inv-pagination button {
            width: 50px; height: 50px; padding: 0; margin: 0;
            border-radius: 12px; font-size: 24px;
            background: var(--tg-theme-button-color, #2481cc);
            font-family: inherit;
        }
        .inv-pagination button:disabled {
            background: #555; opacity: 0.4; cursor: not-allowed;
        }
        .inv-pagination .page-info {
            font-size: 20px;
        }

        /* КОРЗИНА */
        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--tg-theme-secondary-bg-color, #232e3c);
            border-top: 2px solid #27ae60;
            padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        .cart-info { flex: 1; font-size: 19px; }
        .cart-info .cart-count { color: #fff; }
        .cart-info .cart-total { color: #27ae60; font-size: 20px; }
        .cart-btn {
            width: auto; padding: 12px 20px; margin: 0;
            background: #27ae60; color: white;
            border-radius: 10px; border: none; cursor: pointer; font-size: 19px;
            font-family: inherit;
        }

        /* КЕЙСЫ */
        .case-category {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 14px; margin-bottom: 10px;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; font-size: 20px;
        }

        .case-item {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 16px; margin-bottom: 10px; text-align: center;
        }
        .case-name { font-size: 24px; margin-bottom: 6px; }
        .case-price { font-size: 19px; color: var(--tg-theme-hint-color, #999); margin-bottom: 12px; }
        .case-buttons { display: flex; gap: 8px; }
        .btn-case {
            flex: 1; padding: 12px; border-radius: 10px;
            border: none; font-size: 20px;
            cursor: pointer; color: white;
            font-family: inherit;
        }
        .btn-x1 { background: #3498db; }
        .btn-x3 { background: #9b59b6; }
        .btn-x10 { background: #e74c3c; }

        .btn-back {
            background: #666; color: white; margin-bottom: 12px;
            font-family: inherit;
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 16px; padding: 20px;
            width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto;
        }
        .modal h3 { font-size: 24px; margin-bottom: 16px; text-align: center; }
        .modal-btn {
            width: 100%; padding: 14px; margin-bottom: 8px;
            font-size: 19px; border: none; border-radius: 10px;
            cursor: pointer; text-align: left;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            font-family: inherit;
        }
        .modal-btn.primary {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            text-align: center;
        }
        .modal-btn.cancel {
            background: #666; color: white;
            text-align: center; margin-top: 8px;
        }
        .friend-username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 17px; margin-left: 6px;
        }
        .modal-input {
            width: 100%; padding: 12px; font-size: 20px;
            border: 2px solid var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 10px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 12px;
            font-family: inherit;
        }

        /* РУЛЕТКИ */
        .roulette-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.96); z-index: 2000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
            overflow: hidden;
        }
        .roulette-title {
            color: white; font-size: 28px;
            margin-bottom: 16px; text-align: center;
        }
        .roulette-viewport {
            width: 100%; max-width: 500px; height: 160px;
            overflow: hidden; position: relative;
            background: rgba(0, 0, 0, 0.6);
            border-top: 3px solid #f1c40f;
            border-bottom: 3px solid #f1c40f;
            border-radius: 8px;
        }
        .roulette-track {
            display: flex; height: 100%; align-items: center;
            transition: transform 4s cubic-bezier(0.15, 0.7, 0.1, 1);
            will-change: transform;
        }
        .roulette-item {
            width: 130px; height: 140px; flex-shrink: 0;
            margin: 0 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; position: relative;
            border: 2px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }
        .roulette-item img { width: 90px; height: 90px; object-fit: contain; }
        .roulette-item .r-emoji { font-size: 60px; }
        .roulette-item .r-name {
            font-size: 14px; text-align: center;
            padding: 2px 4px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
            width: 100%; margin-top: 4px;
        }

        .roulette-pointer {
            position: absolute; top: 0; bottom: 0;
            left: 50%;
            width: 4px; background: #f1c40f;
            transform: translateX(-50%);
            z-index: 50;
            box-shadow: 0 0 20px #f1c40f, 0 0 40px #f1c40f;
            pointer-events: none;
        }
        .roulette-pointer::before {
            content: ""; position: absolute;
            top: -10px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #f1c40f;
        }
        .roulette-pointer::after {
            content: ""; position: absolute;
            bottom: -10px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 14px solid #f1c40f;
        }

        .multi-roulette-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.96); z-index: 2000;
            display: flex; flex-direction: column;
            padding: 12px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .multi-roulette-title {
            color: white; font-size: 26px;
            text-align: center; margin-bottom: 12px; flex-shrink: 0;
        }
        .multi-roulette-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .multi-roulette-list.cols-1 .mini-roulette { width: 100%; }
        .multi-roulette-list.cols-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .mini-roulette {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 4px;
            overflow: hidden;
            min-width: 0;
        }
        .mini-roulette-viewport {
            width: 100%;
            height: 70px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-top: 2px solid #f1c40f;
            border-bottom: 2px solid #f1c40f;
            border-radius: 6px;
        }
        .mini-roulette-track {
            display: flex;
            height: 100%;
            align-items: center;
            transition: transform 3.5s cubic-bezier(0.15, 0.7, 0.1, 1);
            will-change: transform;
        }
        .mini-roulette-item {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            margin: 0 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
        }
        .mini-roulette-item img { width: 100%; height: 100%; object-fit: contain; }
        .mini-roulette-item span { font-size: 30px; }

        .mini-roulette-pointer {
            position: absolute;
            top: -4px;
            bottom: -4px;
            left: 50%;
            width: 3px;
            background: #f1c40f;
            transform: translateX(-50%);
            z-index: 50;
            box-shadow: 0 0 10px #f1c40f, 0 0 20px #f1c40f;
            pointer-events: none;
        }
        .mini-roulette-pointer::before {
            content: "";
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #f1c40f;
        }
        .mini-roulette-pointer::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid #f1c40f;
        }

        /* РЕЗУЛЬТАТ */
        .result-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92); z-index: 2000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; color: white; text-align: center;
            overflow-y: auto;
        }
        .result-header { font-size: 26px; margin-bottom: 16px; }
        .multi-result-list {
            max-height: 55vh; overflow-y: auto;
            width: 100%; max-width: 400px; margin-bottom: 16px;
        }
        .multi-result-row {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
        }
        .multi-result-row .m-img {
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; flex-shrink: 0;
        }
        .multi-result-row .m-img img { width: 50px; height: 50px; object-fit: contain; }
        .multi-result-info { flex: 1; text-align: left; min-width: 0; }
        .multi-result-name {
            font-size: 19px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .multi-result-price { font-size: 16px; color: #f1c40f; }
        .result-total { font-size: 22px; margin-bottom: 16px; color: #f1c40f; }
        .result-buttons {
            display: flex; flex-direction: column; gap: 10px;
            width: 100%; max-width: 320px;
        }
        .result-btn {
            padding: 16px; border-radius: 12px;
            border: none; font-size: 20px;
            cursor: pointer; color: white;
            font-family: inherit;
        }
        .result-btn.sell { background: #27ae60; }
        .result-btn.again { background: #3498db; }
        .result-btn.close { background: #666; }
    </style>
</head>
<body>

<div class="header">
    <h1>🍽 Piggy Chef</h1>
    <div class="username" id="username">Загрузка...</div>
</div>

<div class="balance-bar">
    <span>💰 Баланс:</span>
    <span class="balance" id="balance-display">...</span>
</div>

<div class="tabs">
    <button class="tab active" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
    <button class="tab" data-tab="inventory" onclick="switchTab('inventory')">🎒 Инвентарь</button>
    <button class="tab" data-tab="cases" onclick="switchTab('cases')">📦 Кейсы</button>
</div>

<div id="content">
    <div class="loading">⏳ Загружаем данные...</div>
</div>

<div id="modal-root"></div>
<div id="roulette-root"></div>

<script>
    const API_URL = "https://preheated-playroom-detective.ngrok-free.dev";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    let currentBalance = 0;
    let casesData = null;

    let inventoryState = {
        offset: 0,
        limit: 20,
        totalCount: 0,
        totalValue: 0,
        items: [],
        cart: new Set(),
        sort: "price_desc",
    };

    function formatNumber(n) {
        if (!n) return "0";
        n = Number(n);
        if (n < 1000) return n.toString();
        if (n < 1000000) return (n / 1000).toFixed(1) + "K";
        if (n < 1000000000) return (n / 1000000).toFixed(1) + "M";
        if (n < 1000000000000) return (n / 1000000000).toFixed(1) + "B";
        if (n < 1000000000000000) return (n / 1000000000000).toFixed(1) + "T";
        return (n / 1000000000000000).toFixed(1) + "Qa";
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
    }

    function updateBalance(b) {
        currentBalance = b;
        document.getElementById("balance-display").textContent = formatNumber(b) + "₽";
    }

    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-tab="${tab}"]`).classList.add("active");

        const oldCart = document.getElementById("cart-bar");
        if (oldCart) oldCart.remove();

        if (tab === "profile") loadProfile();
        if (tab === "inventory") loadInventory();
        if (tab === "cases") loadCases();
    }

    async function loadProfile() {
        if (!user) {
            document.getElementById("content").innerHTML =
                '<div class="error">❌ Открой меня внутри Telegram!</div>';
            return;
        }

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем данные...</div>';

        try {
            const res = await fetch(`${API_URL}/api/profile?user_id=${user.id}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            const u = data.user;
            updateBalance(u.balance);

            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="label">💰 Баланс</div>
                    <div class="value">${formatNumber(u.balance)}₽</div>
                </div>
                <div class="card">
                    <div class="label">✨ Опыт</div>
                    <div class="value">${formatNumber(u.xp)} XP</div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">🏪 Ресторан</div>
                        <div class="value">${u.restaurant_level} ур.</div>
                    </div>
                    <div class="card">
                        <div class="label">🔥 Стрик</div>
                        <div class="value">${u.streak} дн.</div>
                    </div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">📦 Кейсов</div>
                        <div class="value">${formatNumber(u.total_cases)}</div>
                    </div>
                    <div class="card">
                        <div class="label">⭐ Репутация</div>
                        <div class="value">${u.reputation}</div>
                    </div>
                </div>
                <button onclick="loadProfile()">🔄 Обновить</button>
            `;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    async function loadInventory() {
        if (!user) return;

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;

        await fetchInventoryPage(inventoryState.offset);
    }

    async function fetchInventoryPage(offset) {
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем инвентарь...</div>';

        try {
            const res = await fetch(
                `${API_URL}/api/inventory?user_id=${user.id}&offset=${offset}&limit=${inventoryState.limit}&sort=${inventoryState.sort}`,
                { headers: { "ngrok-skip-browser-warning": "true" } }
            );
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            inventoryState.offset = data.offset;
            inventoryState.totalCount = data.total_count;
            inventoryState.totalValue = data.total_value;
            inventoryState.items = data.items;

            renderInventory();
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    function renderInventory() {
        const { items, offset, limit, totalCount, totalValue, cart } = inventoryState;

        if (totalCount === 0) {
            document.getElementById("content").innerHTML =
                '<div class="card"><div class="label">🎒 Инвентарь пуст</div></div>';
            return;
        }

        let html = `
            <div class="inv-header">
                <div>🎒 Всего: ${totalCount}</div>
                <div class="total-value">💰 ${formatNumber(totalValue)}₽</div>
            </div>
            <div class="sort-bar">
                <button class="sort-btn ${inventoryState.sort === 'price_desc' ? 'active' : ''}" onclick="changeSort('price_desc')">💰 Дорогие</button>
                <button class="sort-btn ${inventoryState.sort === 'price_asc' ? 'active' : ''}" onclick="changeSort('price_asc')">💰 Дешёвые</button>
                <button class="sort-btn ${inventoryState.sort === 'new' ? 'active' : ''}" onclick="changeSort('new')">🆕 Новые</button>
                <button class="sort-btn ${inventoryState.sort === 'old' ? 'active' : ''}" onclick="changeSort('old')">🕐 Старые</button>
            </div>
        `;

        for (const item of items) {
            const isSelected = cart.has(item.code);
            const isArtifact = item.is_artifact;

            const imgHtml = item.image
                ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">`
                : `<span>${item.rarity}</span>`;

            const insuredBtn = item.insured
                ? `<button class="btn-tiny btn-tiny-insure disabled" disabled>🛡</button>`
                : `<button class="btn-tiny btn-tiny-insure" onclick="insureItem('${item.code}')">🛡</button>`;

            const checkboxHtml = isArtifact
                ? `<div class="item-checkbox-placeholder">⭐</div>`
                : `<div class="item-checkbox ${isSelected ? 'checked' : ''}"
                        onclick="toggleCart('${item.code}')">
                     ${isSelected ? '✓' : ''}
                   </div>`;

            const actionsHtml = isArtifact
                ? `<button class="btn-tiny btn-tiny-gift" onclick="giftItem('${item.code}')">🎁</button>`
                : `${insuredBtn}
                   <button class="btn-tiny btn-tiny-gift" onclick="giftItem('${item.code}')">🎁</button>`;

            html += `
                <div class="item ${isSelected ? 'selected' : ''}">
                    ${checkboxHtml}
                    <div class="item-img">${imgHtml}</div>
                    <div class="item-info">
                        <div class="item-name">${item.rarity} ${escapeHtml(item.name)}</div>
                        <div class="item-price">${formatNumber(item.price)}₽</div>
                        <div class="item-code">${item.code}${item.insured ? ' 🛡' : ''}${isArtifact ? ' ⭐' : ''}</div>
                    </div>
                    <div class="item-actions">${actionsHtml}</div>
                </div>
            `;
        }

        const currentPage = Math.floor(offset / limit) + 1;
        const totalPages = Math.ceil(totalCount / limit);

        html += `
            <div class="inv-pagination">
                <button onclick="changePage(-1)" ${offset === 0 ? 'disabled' : ''}>⬅️</button>
                <div class="page-info">${currentPage} / ${totalPages}</div>
                <button onclick="changePage(1)" ${offset + limit >= totalCount ? 'disabled' : ''}>➡️</button>
            </div>
        `;

        document.getElementById("content").innerHTML = html;
        renderCartBar();
    }

    function changeSort(newSort) {
        inventoryState.sort = newSort;
        inventoryState.offset = 0;
        fetchInventoryPage(0);
    }

    function changePage(delta) {
        const newOffset = inventoryState.offset + delta * inventoryState.limit;
        if (newOffset < 0 || newOffset >= inventoryState.totalCount) return;
        fetchInventoryPage(newOffset);
    }

    function toggleCart(code) {
        const cart = inventoryState.cart;
        if (cart.has(code)) cart.delete(code);
        else cart.add(code);
        renderInventory();
    }

    function renderCartBar() {
        const oldCart = document.getElementById("cart-bar");
        if (oldCart) oldCart.remove();

        const cart = inventoryState.cart;
        if (cart.size === 0) return;

        let total = 0;
        for (const item of inventoryState.items) {
            if (cart.has(item.code)) total += item.price;
        }

        const cartBar = document.createElement("div");
        cartBar.className = "cart-bar";
        cartBar.id = "cart-bar";
        cartBar.innerHTML = `
            <div class="cart-info">
                <div>🛒 В корзине: ${cart.size}</div>
                <div>💰 Всего: <span class="cart-total">${formatNumber(total)}₽</span></div>
            </div>
            <button class="cart-btn" onclick="sellCart()">💵 Продать</button>
        `;
        document.body.appendChild(cartBar);
    }

    async function sellCart() {
        const cart = inventoryState.cart;
        if (cart.size === 0) return;
        if (!confirm(`💵 Продать ${cart.size} предметов?`)) return;

        try {
            const res = await fetch(`${API_URL}/api/sell_bulk`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, codes: Array.from(cart) })
            });
            const data = await res.json();
            if (data.ok) {
                updateBalance(data.new_balance);
                cart.clear();
                fetchInventoryPage(inventoryState.offset);
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    async function insureItem(code) {
        if (!confirm("🛡 Застраховать предмет на 24 часа?\nСтоимость: 12% от цены.")) return;
        try {
            const res = await fetch(`${API_URL}/api/insure_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, item_code: code })
            });
            const data = await res.json();
            if (data.ok) {
                if (data.new_balance !== undefined) updateBalance(data.new_balance);
                fetchInventoryPage(inventoryState.offset);
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    function giftItem(code) {
        fetch(`${API_URL}/api/friends?user_id=${user.id}`, {
            headers: { "ngrok-skip-browser-warning": "true" }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.ok) { alert("❌ " + data.error); return; }
            showGiftModal(code, data.friends || []);
        })
        .catch(err => alert("❌ Ошибка: " + err.message));
    }

    function showGiftModal(code, friends) {
        const modalRoot = document.getElementById("modal-root");
        let friendsHtml = "";
        if (friends.length === 0) {
            friendsHtml = '<div style="text-align:center;color:#999;padding:10px;">Нет друзей</div>';
        } else {
            for (const f of friends) {
                const displayName = f.first_name || f.username || `id${f.user_id}`;
                const uname = f.username ? `@${f.username}` : `id${f.user_id}`;
                friendsHtml += `
                    <button class="modal-btn" onclick="sendGift('${code}', ${f.user_id}, null)">
                        ${escapeHtml(displayName)}<span class="friend-username">${escapeHtml(uname)}</span>
                    </button>
                `;
            }
        }

        modalRoot.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
                <div class="modal">
                    <h3>🎁 Кому подарить?</h3>
                    <button class="modal-btn primary" onclick="showUsernameInput('${code}')">✏️ Ввести @username</button>
                    <div style="margin-top:12px;margin-bottom:8px;font-size:15px;color:#999;text-align:center;">или выбери из друзей:</div>
                    ${friendsHtml}
                    <button class="modal-btn cancel" onclick="closeModal()">❌ Отмена</button>
                </div>
            </div>
        `;
    }

    function showUsernameInput(code) {
        const modalRoot = document.getElementById("modal-root");
        modalRoot.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
                <div class="modal">
                    <h3>🎁 Введи @username</h3>
                    <input type="text" id="gift-username-input" class="modal-input" placeholder="@username или ID" autocomplete="off">
                    <button class="modal-btn primary" onclick="sendGiftByUsername('${code}')">✅ Отправить</button>
                    <button class="modal-btn cancel" onclick="giftItem('${code}')">⬅️ Назад</button>
                </div>
            </div>
        `;
        setTimeout(() => document.getElementById("gift-username-input").focus(), 100);
    }

    function sendGiftByUsername(code) {
        const input = document.getElementById("gift-username-input");
        const value = input.value.trim().replace("@", "");
        if (!value) { alert("❌ Введи username или ID"); return; }
        const isId = /^\d+$/.test(value);
        if (isId) sendGift(code, parseInt(value), null);
        else sendGift(code, null, value);
    }

    async function sendGift(code, toUserId, toUsername) {
        closeModal();
        const body = { user_id: user.id, item_code: code };
        if (toUserId) body.to_user_id = toUserId;
        if (toUsername) body.to_username = toUsername;

        try {
            const res = await fetch(`${API_URL}/api/gift_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.ok) {
                fetchInventoryPage(inventoryState.offset);
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
    }

    async function loadCases() {
        if (!user) return;

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем кейсы...</div>';

        try {
            const res = await fetch(`${API_URL}/api/cases`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            casesData = data.categories;
            renderCategories();
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    function renderCategories() {
        let html = '<div class="card"><div class="label">📦 Выбери категорию</div></div>';
        for (const cat of casesData) {
            html += `
                <div class="case-category" onclick="renderCaseList('${cat.id}')">
                    <span>${escapeHtml(cat.name)}</span>
                    <span>▶️</span>
                </div>
            `;
        }
        document.getElementById("content").innerHTML = html;
    }

    function renderCaseList(catId) {
        const cat = casesData.find(c => c.id === catId);
        if (!cat) return;

        let html = `<button class="btn-back" onclick="renderCategories()">⬅️ Назад к категориям</button>`;
        html += `<div class="card"><div class="label">${escapeHtml(cat.name)}</div></div>`;

        for (const c of cat.cases) {
            html += `
                <div class="case-item">
                    <div class="case-name">${escapeHtml(c.name)}</div>
                    <div class="case-price">${formatNumber(c.price)}₽</div>
                    <div class="case-buttons">
                        <button class="btn-case btn-x1" onclick="openCase('${c.id}', 1)">×1</button>
                        <button class="btn-case btn-x3" onclick="openCase('${c.id}', 3)">×3</button>
                        <button class="btn-case btn-x10" onclick="openCase('${c.id}', 10)">×10</button>
                    </div>
                </div>
            `;
        }
        document.getElementById("content").innerHTML = html;
    }

    async function openCase(caseId, count) {
        if (!user) return;

        let casePrice = 0;
        for (const cat of casesData) {
            for (const c of cat.cases) {
                if (c.id === caseId) { casePrice = c.price; break; }
            }
        }

        const total = casePrice * count;
        if (currentBalance < total) {
            alert(`❌ Нужно ${formatNumber(total)}₽, у тебя ${formatNumber(currentBalance)}₽`);
            return;
        }

        let pool = [], caseName = "";
        try {
            const res = await fetch(`${API_URL}/api/case_preview?case_id=${caseId}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) { alert("❌ " + data.error); return; }
            pool = data.pool || [];
            caseName = data.case_name || "";
        } catch (err) { alert("❌ " + err.message); return; }

        if (pool.length === 0) { alert("❌ Кейс пустой"); return; }

        let openResult;
        try {
            const res = await fetch(`${API_URL}/api/open_case`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, case_id: caseId, count })
            });
            openResult = await res.json();
            if (!openResult.ok) { alert("❌ " + openResult.error); return; }
        } catch (err) { alert("❌ " + err.message); return; }

        updateBalance(openResult.new_balance);

        if (count === 1) {
            showSingleBigRoulette(caseName, pool, openResult.results[0], () => {
                showMultiResult(openResult.results, caseId, count);
            });
        } else {
            showAllMiniRoulettes(caseName, count, pool, openResult.results, () => {
                showMultiResult(openResult.results, caseId, count);
            });
        }
    }

    function showSingleBigRoulette(caseName, pool, result, onDone) {
        const rouletteRoot = document.getElementById("roulette-root");
        const targetIndex = result.pool_index !== undefined
            ? result.pool_index : Math.floor(Math.random() * pool.length);

        const RANDOM_BEFORE = 40, TOTAL_ITEMS = 60;
        const strip = [];
        for (let i = 0; i < RANDOM_BEFORE; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);
        strip.push(pool[targetIndex]);
        for (let i = 0; i < TOTAL_ITEMS - RANDOM_BEFORE - 1; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);

        let trackHtml = "";
        for (const item of strip) {
            const img = item.image ? `<img src="${item.image}" alt="">` : `<span class="r-emoji">${item.rarity}</span>`;
            trackHtml += `<div class="roulette-item">${img}<div class="r-name">${escapeHtml(item.name)}</div></div>`;
        }

        rouletteRoot.innerHTML = `
            <div class="roulette-container">
                <div class="roulette-title">🎰 ${escapeHtml(caseName)}</div>
                <div class="roulette-viewport">
                    <div class="roulette-pointer"></div>
                    <div class="roulette-track" id="roulette-track">${trackHtml}</div>
                </div>
            </div>
        `;

        const ITEM_WIDTH = 140;
        const viewportWidth = Math.min(window.innerWidth - 40, 500);
        const pointerPos = viewportWidth / 2;
        const winningCenter = RANDOM_BEFORE * ITEM_WIDTH + ITEM_WIDTH / 2;
        const offset = winningCenter - pointerPos;
        const randomShift = (Math.random() - 0.5) * 60;
        const finalOffset = offset + randomShift;

        setTimeout(() => {
            const track = document.getElementById("roulette-track");
            if (track) track.style.transform = `translateX(-${finalOffset}px)`;
        }, 100);

        setTimeout(onDone, 4300);
    }

    function showAllMiniRoulettes(caseName, count, pool, results, onDone) {
        const rouletteRoot = document.getElementById("roulette-root");

        const isTwoCols = count >= 6;
        const listClass = isTwoCols ? "multi-roulette-list cols-2" : "multi-roulette-list cols-1";

        let roulettesHtml = "";
        const configs = [];

        for (let idx = 0; idx < count; idx++) {
            const result = results[idx];
            const targetIndex = result.pool_index !== undefined
                ? result.pool_index : Math.floor(Math.random() * pool.length);

            const RANDOM_BEFORE = 30, TOTAL_ITEMS = 45;
            const strip = [];
            for (let i = 0; i < RANDOM_BEFORE; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);
            strip.push(pool[targetIndex]);
            for (let i = 0; i < TOTAL_ITEMS - RANDOM_BEFORE - 1; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);

            let trackHtml = "";
            for (const item of strip) {
                const img = item.image ? `<img src="${item.image}" alt="">` : `<span>${item.rarity}</span>`;
                trackHtml += `<div class="mini-roulette-item">${img}</div>`;
            }

            roulettesHtml += `
                <div class="mini-roulette">
                    <div class="mini-roulette-viewport">
                        <div class="mini-roulette-pointer"></div>
                        <div class="mini-roulette-track" id="mini-track-${idx}">${trackHtml}</div>
                    </div>
                </div>
            `;
            configs.push({ idx });
        }

        rouletteRoot.innerHTML = `
            <div class="multi-roulette-container">
                <div class="multi-roulette-title">🎰 ${escapeHtml(caseName)} ×${count}</div>
                <div class="${listClass}">
                    ${roulettesHtml}
                </div>
            </div>
        `;

        setTimeout(() => {
            const ITEM_WIDTH = 64;

            for (const cfg of configs) {
                const track = document.getElementById(`mini-track-${cfg.idx}`);
                if (!track) continue;

                const viewport = track.parentElement;
                const viewportWidth = viewport.clientWidth;
                const pointerPos = viewportWidth / 2;
                const winningCenter = 30 * ITEM_WIDTH + ITEM_WIDTH / 2;
                const offset = winningCenter - pointerPos;
                const randomShift = (Math.random() - 0.5) * 40;
                const finalOffset = offset + randomShift;
                track.style.transform = `translateX(-${finalOffset}px)`;
            }
        }, 100);

        setTimeout(onDone, 4300);
    }

    function closeRoulette() {
        document.getElementById("roulette-root").innerHTML = "";
    }

    function showMultiResult(results, caseId, count) {
        const rouletteRoot = document.getElementById("roulette-root");

        let listHtml = "";
        let totalValue = 0;
        for (const r of results) {
            totalValue += r.price;
            const imgHtml = r.image ? `<img src="${r.image}">` : `<span>${r.rarity}</span>`;
            listHtml += `
                <div class="multi-result-row">
                    <div class="m-img">${imgHtml}</div>
                    <div class="multi-result-info">
                        <div class="multi-result-name">${r.rarity} ${escapeHtml(r.name)}</div>
                        <div class="multi-result-price">${formatNumber(r.price)}₽</div>
                    </div>
                </div>
            `;
        }

        rouletteRoot.innerHTML = `
            <div class="result-container">
                <div class="result-header">🎁 Открыто ${count} кейсов</div>
                <div class="result-total">💰 Всего: ${formatNumber(totalValue)}₽</div>
                <div class="multi-result-list">${listHtml}</div>
                <div class="result-buttons">
                    <button class="result-btn sell" onclick="sellAllResults(${JSON.stringify(results.map(r => r.code)).replace(/"/g, '&quot;')})">💵 Продать всё за ${formatNumber(totalValue)}₽</button>
                    <button class="result-btn again" onclick="closeRoulette(); openCase('${caseId}', ${count})">🔁 Открыть ещё ×${count}</button>
                    <button class="result-btn close" onclick="closeRoulette()">⬅️ К кейсам</button>
                </div>
            </div>
        `;
    }

    async function sellAllResults(codes) {
        if (!confirm(`💵 Продать всё за ${codes.length} предметов?`)) return;
        try {
            const res = await fetch(`${API_URL}/api/sell_bulk`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, codes: codes })
            });
            const data = await res.json();
            if (data.ok) {
                updateBalance(data.new_balance);
                closeRoulette();
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    switchTab("profile");
</script>

</body>
</html>
