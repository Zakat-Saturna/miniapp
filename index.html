<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piggy Chef</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
 <style>
    /* ============================================================ */
    /* ШРИФТ */
    /* ============================================================ */
    @font-face {
        font-family: 'Classic Console Neue';
        src: url('ClassicConsoleNeue.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: block;
    }

    /* ============================================================ */
    /* ПИКСЕЛЬНАЯ ПАЛИТРА */
    /* ============================================================ */
    :root {
        --pixel-black: #0a0a14;
        --pixel-dark: #1a1a2e;
        --pixel-dark-2: #252540;
        --pixel-green: #4ade80;
        --pixel-dark-green: #22c55e;
        --pixel-blue: #60a5fa;
        --pixel-yellow: #fbbf24;
        --pixel-orange: #fb923c;
        --pixel-red: #ef4444;
        --pixel-purple: #a855f7;
        --pixel-pink: #ec4899;
        --pixel-bg: #0f172a;
        --pixel-text: #e0e7ff;
        --pixel-hint: #94a3b8;
        --pixel-border: #000000;
        --pixel-shadow: 4px 4px 0 var(--pixel-border);
        --pixel-shadow-sm: 3px 3px 0 var(--pixel-border);
        --pixel-shadow-xs: 2px 2px 0 var(--pixel-border);
    }

    /* ============================================================ */
    /* БАЗА */
    /* ============================================================ */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        font-family: 'Classic Console Neue', 'Courier New', monospace;
        overflow-x: hidden;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        image-rendering: pixelated;
    }

    body {
        padding: 16px;
        background: var(--pixel-bg);
        color: var(--pixel-text);
        font-size: 16px;
        line-height: 1.4;
        min-height: 100vh;
        position: relative;
    }

    /* Убрал фоновую картинку — для пиксельного стиля лучше чистый фон */
    /* Если хочешь — раскомментируй и поставь пиксельную текстуру */
    /*
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url('...');
        background-size: 64px 64px;
        background-repeat: repeat;
        opacity: 0.05;
        z-index: -1;
        pointer-events: none;
        image-rendering: pixelated;
    }
    */

    button, input, select, textarea {
        font-family: inherit;
    }

    img {
        image-rendering: pixelated;
    }

    /* ============================================================ */
    /* ХЕДЕР */
    /* ============================================================ */
    .header {
        text-align: center;
        margin-bottom: 16px;
    }

    .header h1 {
        font-size: 32px;
        margin-bottom: 8px;
        color: var(--pixel-yellow);
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0 var(--pixel-border);
    }

    .header .username {
        color: var(--pixel-hint);
        font-size: 16px;
    }

    /* ============================================================ */
    /* БАЛАНС */
    /* ============================================================ */
    .balance-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 16px;
        box-shadow: var(--pixel-shadow);
        text-transform: uppercase;
    }

    .balance-bar .balance {
        color: var(--pixel-green);
        font-size: 22px;
        font-weight: bold;
    }

    /* ============================================================ */
    /* ТАБЫ */
    /* ============================================================ */
    .tabs-row {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
    }

    .tabs-row:last-of-type {
        margin-bottom: 16px;
    }

    .tab {
        flex: 1;
        padding: 14px 6px;
        font-size: 24px;
        background: var(--pixel-dark);
        color: var(--pixel-text);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        cursor: pointer;
        font-family: inherit;
        line-height: 1;
        min-width: 0;
        box-shadow: var(--pixel-shadow-sm);
        transition: none;
    }

    .tab.active {
        background: var(--pixel-green);
        color: var(--pixel-black);
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .tab:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    /* ============================================================ */
    /* КАРТОЧКИ */
    /* ============================================================ */
    .card {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--pixel-shadow);
    }

    .card .label {
        font-size: 14px;
        color: var(--pixel-hint);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .card .value {
        font-size: 24px;
        color: var(--pixel-green);
        font-weight: bold;
    }

    .row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
    }

    .row .card {
        flex: 1;
        margin-bottom: 0;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: var(--pixel-hint);
        font-size: 20px;
        text-transform: uppercase;
    }

    .error {
        background: var(--pixel-red);
        color: white;
        padding: 12px;
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        margin-bottom: 12px;
        box-shadow: var(--pixel-shadow-sm);
    }

    /* ============================================================ */
    /* КНОПКИ — ГЛАВНОЕ */
    /* ============================================================ */
    button {
        width: 100%;
        padding: 12px 16px;
        font-size: 16px;
        font-family: inherit;
        background: var(--pixel-green);
        color: var(--pixel-black);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        box-shadow: var(--pixel-shadow);
        cursor: pointer;
        margin: 8px 0 16px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
        transition: none;
        position: relative;
    }

    button:hover {
        background: var(--pixel-dark-green);
    }

    button:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    button:disabled {
        background: #4a5568;
        color: #a0aec0;
        cursor: not-allowed;
        box-shadow: none;
        transform: translate(3px, 3px);
    }

    /* ============================================================ */
    /* ИНВЕНТАРЬ */
    /* ============================================================ */
    .inv-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 10px 14px;
        margin-bottom: 10px;
        font-size: 16px;
        box-shadow: var(--pixel-shadow-sm);
        text-transform: uppercase;
    }

    .inv-header .total-value {
        color: var(--pixel-green);
        font-weight: bold;
    }

    .sort-bar {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
        overflow-x: auto;
        padding-bottom: 4px;
    }

    .sort-btn {
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 0;
        border: 3px solid var(--pixel-border);
        background: var(--pixel-dark);
        color: var(--pixel-text);
        cursor: pointer;
        white-space: nowrap;
        width: auto;
        margin: 0;
        font-family: inherit;
        box-shadow: var(--pixel-shadow-xs);
        text-transform: uppercase;
        transition: none;
    }

    .sort-btn.active {
        background: var(--pixel-green);
        color: var(--pixel-black);
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    .item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 12px;
        margin-bottom: 8px;
        box-shadow: var(--pixel-shadow-sm);
        transition: none;
    }

    .item.selected {
        background: #14532d;
        border-color: var(--pixel-green);
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .item.is-season {
        background: #78350f;
        border-color: var(--pixel-yellow);
    }

   .item-img {
    width: 72px;
    height: 72px;
    background: var(--pixel-black);
    border: 2px solid var(--pixel-border);
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;               /* ← обрезает всё лишнее */
    image-rendering: pixelated;
    padding: 0;                     /* ← убираем отступ */
}

.item-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;              /* ← было contain — картинка ЗАПОЛНЯЕТ контейнер */
    object-position: center;
    image-rendering: pixelated;
    display: block;
}
    .item-info {
        flex: 1;
        min-width: 0;
    }

    .item-name {
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 2px;
        color: var(--pixel-text);
    }

    .item-price {
        font-size: 16px;
        color: var(--pixel-green);
        font-weight: bold;
    }

    .item-code {
        font-size: 12px;
        color: var(--pixel-hint);
        font-family: monospace;
    }

    .item-actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .item-checkbox {
        width: 28px;
        height: 28px;
        border-radius: 0;
        border: 3px solid var(--pixel-border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
        font-size: 20px;
        color: var(--pixel-black);
        background: var(--pixel-dark-2);
        transition: none;
    }

    .item-checkbox.checked {
        background: var(--pixel-green);
        border-color: var(--pixel-border);
    }

    .item-checkbox-placeholder {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
    }

    .btn-tiny {
        width: 40px;
        height: 36px;
        font-size: 18px;
        padding: 0;
        margin: 0;
        border-radius: 0;
        border: 2px solid var(--pixel-border);
        cursor: pointer;
        color: white;
        font-family: inherit;
        box-shadow: var(--pixel-shadow-xs);
        transition: none;
    }

    .btn-tiny:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    .btn-tiny-insure {
        background: var(--pixel-blue);
    }

    .btn-tiny-gift {
        background: var(--pixel-orange);
    }

    .btn-tiny-insure.disabled {
        background: #555;
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
    }

    .inv-pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 14px;
        margin-bottom: 14px;
    }

    .inv-pagination button {
        width: 50px;
        height: 50px;
        padding: 0;
        margin: 0;
        border-radius: 0;
        font-size: 22px;
        background: var(--pixel-blue);
        color: var(--pixel-black);
        font-family: inherit;
        box-shadow: var(--pixel-shadow-sm);
    }

    .inv-pagination button:disabled {
        background: #555;
        opacity: 0.4;
        cursor: not-allowed;
    }

    .inv-pagination .page-info {
        font-size: 18px;
        text-transform: uppercase;
    }

    .sell-all-btn {
        background: var(--pixel-green);
        margin-bottom: 100px;
    }

    /* ============================================================ */
    /* КОРЗИНА */
    /* ============================================================ */
    .cart-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--pixel-dark);
        border-top: 4px solid var(--pixel-green);
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        z-index: 100;
        box-shadow: 0 -4px 0 var(--pixel-border);
    }

    .cart-info {
        flex: 1;
        font-size: 16px;
        text-transform: uppercase;
    }

    .cart-info .cart-count {
        color: var(--pixel-text);
    }

    .cart-info .cart-total {
        color: var(--pixel-green);
        font-size: 18px;
        font-weight: bold;
    }

    .cart-btn {
        width: auto;
        padding: 12px 20px;
        margin: 0;
        background: var(--pixel-green);
        color: var(--pixel-black);
        border-radius: 0;
        border: 3px solid var(--pixel-border);
        cursor: pointer;
        font-size: 16px;
        font-family: inherit;
        font-weight: bold;
        box-shadow: var(--pixel-shadow-xs);
        text-transform: uppercase;
    }

    .cart-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    /* ============================================================ */
    /* КЕЙСЫ */
    /* ============================================================ */
    .case-category {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 14px;
        margin-bottom: 10px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 16px;
        box-shadow: var(--pixel-shadow);
        text-transform: uppercase;
        transition: none;
    }

    .case-category:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .case-item {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 16px;
        margin-bottom: 10px;
        text-align: center;
        box-shadow: var(--pixel-shadow);
    }

    .case-name {
        font-size: 18px;
        margin-bottom: 6px;
        color: var(--pixel-yellow);
        text-transform: uppercase;
    }

    .case-price {
        font-size: 16px;
        color: var(--pixel-hint);
        margin-bottom: 12px;
    }

    .case-buttons {
        display: flex;
        gap: 8px;
    }

    .btn-case {
        flex: 1;
        padding: 12px;
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        font-size: 16px;
        cursor: pointer;
        color: var(--pixel-black);
        font-family: inherit;
        margin: 0;
        font-weight: bold;
        box-shadow: var(--pixel-shadow-sm);
        transition: none;
        text-transform: uppercase;
    }

    .btn-case:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .btn-x1 { background: var(--pixel-blue); }
    .btn-x3 { background: var(--pixel-purple); color: white; }
    .btn-x10 { background: var(--pixel-red); color: white; }

    .btn-back {
        background: var(--pixel-dark-2);
        color: var(--pixel-text);
        margin-bottom: 12px;
        font-family: inherit;
    }

    /* ============================================================ */
    /* РЕСТОРАН */
    /* ============================================================ */
    .restaurant-image {
        width: 100%;
        max-width: 400px;
        height: auto;
        margin: 0 auto 16px;
        display: block;
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        background: var(--pixel-black);
        min-height: 200px;
        object-fit: contain;
        box-shadow: var(--pixel-shadow);
        image-rendering: pixelated;
    }

    .restaurant-image-placeholder {
        width: 100%;
        max-width: 400px;
        height: 200px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--pixel-black);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        font-size: 80px;
        box-shadow: var(--pixel-shadow);
    }

    .upgrade-block {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--pixel-shadow-sm);
    }

    .upgrade-block .upgrade-title {
        font-size: 16px;
        margin-bottom: 6px;
        color: var(--pixel-yellow);
        text-transform: uppercase;
    }

    .upgrade-block .upgrade-info {
        font-size: 14px;
        color: var(--pixel-hint);
        margin-bottom: 10px;
    }

    .upgrade-block button {
        margin-top: 0;
        margin-bottom: 0;
        font-size: 16px;
        padding: 12px;
    }

    .worker-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        background: var(--pixel-black);
        border: 2px solid var(--pixel-border);
        border-radius: 0;
        margin-bottom: 6px;
        font-size: 14px;
        gap: 8px;
    }

    .worker-row .worker-info {
        flex: 1;
        min-width: 0;
    }

    .worker-row .worker-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .worker-row .worker-bonus {
        color: var(--pixel-green);
        white-space: nowrap;
        font-weight: bold;
    }

    .worker-row .btn-fire {
        width: auto;
        padding: 6px 12px;
        margin: 0;
        background: var(--pixel-red);
        color: white;
        font-size: 14px;
        border-radius: 0;
        border: 2px solid var(--pixel-border);
        box-shadow: var(--pixel-shadow-xs);
        transition: none;
    }

    .worker-row .btn-fire:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    /* ============================================================ */
    /* КРАФТ */
    /* ============================================================ */
    .craft-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 14px;
        margin-bottom: 8px;
        box-shadow: var(--pixel-shadow-sm);
    }

    .craft-info {
        flex: 1;
    }

    .craft-title {
        font-size: 16px;
        margin-bottom: 4px;
        text-transform: uppercase;
    }

    .craft-count {
        font-size: 14px;
        color: var(--pixel-hint);
    }

    .craft-btn {
        width: auto;
        padding: 10px 16px;
        margin: 0;
        font-size: 16px;
        box-shadow: var(--pixel-shadow-xs);
    }

    /* ============================================================ */
    /* КОЛЛЕКЦИЯ */
    /* ============================================================ */
    .coll-rarity-block {
        margin-bottom: 16px;
    }

    .coll-rarity-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        cursor: pointer;
        font-size: 16px;
        margin-bottom: 6px;
        box-shadow: var(--pixel-shadow-sm);
        text-transform: uppercase;
    }

    .coll-rarity-header:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .coll-rarity-progress {
        font-size: 14px;
        color: var(--pixel-hint);
    }

    .coll-dish {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 14px;
        margin-bottom: 4px;
        background: var(--pixel-black);
        border: 2px solid var(--pixel-border);
        border-radius: 0;
        font-size: 14px;
    }

    .coll-dish.opened {
        background: #14532d;
        border-color: var(--pixel-green);
    }

    .coll-dish .name {
        flex: 1;
    }

    .coll-dish .price {
        color: var(--pixel-yellow);
        font-size: 13px;
        font-weight: bold;
    }

    .coll-dish .check {
        width: 24px;
        text-align: center;
        font-size: 18px;
    }

    /* ============================================================ */
    /* ДОСТИЖЕНИЯ */
    /* ============================================================ */
    .ach-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 14px;
        margin-bottom: 8px;
        transition: none;
        box-shadow: var(--pixel-shadow-sm);
    }

    .ach-row.unlocked {
        background: #14532d;
        border-color: var(--pixel-green);
    }

    .ach-row.clickable {
        cursor: pointer;
        border-color: var(--pixel-yellow);
        box-shadow: 3px 3px 0 var(--pixel-yellow);
    }

    .ach-row.clickable:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-yellow);
    }

    .ach-row.claimed {
        opacity: 0.5;
    }

    .ach-info {
        flex: 1;
        min-width: 0;
    }

    .ach-name {
        font-size: 16px;
        margin-bottom: 2px;
        text-transform: uppercase;
    }

    .ach-desc {
        font-size: 13px;
        color: var(--pixel-hint);
    }

    .ach-reward {
        font-size: 15px;
        color: var(--pixel-yellow);
        text-align: right;
        white-space: nowrap;
        font-weight: bold;
    }

    .ach-badge {
        display: block;
        font-size: 12px;
        margin-top: 4px;
        padding: 3px 8px;
        border: 2px solid var(--pixel-border);
        border-radius: 0;
        text-align: center;
        font-family: inherit;
        text-transform: uppercase;
    }

    .ach-badge.ready {
        background: var(--pixel-green);
        color: var(--pixel-black);
        animation: ach-pulse 1.5s infinite steps(2);
    }

    .ach-badge.done {
        background: var(--pixel-black);
        color: var(--pixel-hint);
    }

    @keyframes ach-pulse {
        0%, 100% { background: var(--pixel-green); }
        50% { background: var(--pixel-dark-green); }
    }

    /* ============================================================ */
    /* ДРУЗЬЯ */
    /* ============================================================ */
    .friend-row {
        display: flex;

        font-size: 13px;

    /* ============================================================ */
    /* РАБОТА */
    /* ============================================================ */
    .job-card {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--pixel-shadow);
    }

    .job-card .job-title {
        font-size: 18px;
        margin-bottom: 8px;
        color: var(--pixel-yellow);
        text-transform: uppercase;
    }

    .job-card .job-info {
        font-size: 14px;
        color: var(--pixel-hint);
        margin-bottom: 4px;
    }

    /* ============================================================ */
    /* РЕФЕРАЛКА */
    /* ============================================================ */
    .ref-link {
        background: var(--pixel-black);
        border: 2px solid var(--pixel-border);
        border-radius: 0;
        padding: 12px;
        font-family: monospace;
        font-size: 13px;
        word-break: break-all;
        margin-bottom: 12px;
        user-select: all;
        color: var(--pixel-green);
    }

    .ref-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
    }

    .ref-buttons button {
        flex: 1;
        padding: 12px;
        font-size: 14px;
        margin: 0;
    }

    /* ============================================================ */
    /* УВЕДОМЛЕНИЯ */
    /* ============================================================ */
    .notif-container {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 5000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
    }

    .notif {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-green);
        border-radius: 0;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: var(--pixel-shadow);
        pointer-events: auto;
        transform: translateY(-120%);
        opacity: 0;
        transition: transform 0.3s steps(6), opacity 0.3s steps(6);
        max-width: 100%;
    }

    .notif.visible {
        transform: translateY(0);
        opacity: 1;
    }

    .notif-icon {
        font-size: 28px;
        flex-shrink: 0;
    }

    .notif-body {
        flex: 1;
        min-width: 0;
    }

    .notif-title {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 2px;
        text-transform: uppercase;
    }

    .notif-text {
        font-size: 13px;
        color: var(--pixel-hint);
    }

    .notif-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
    }

    .notif-btn {
        width: 38px;
        height: 38px;
        padding: 0;
        margin: 0;
        border-radius: 0;
        border: 2px solid var(--pixel-border);
        font-size: 18px;
        cursor: pointer;
        color: white;
        font-family: inherit;
        box-shadow: var(--pixel-shadow-xs);
        transition: none;
    }

    .notif-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    .notif-btn.accept { background: var(--pixel-green); color: var(--pixel-black); }
    .notif-btn.decline { background: var(--pixel-red); }
    .notif-btn.close { background: #666; }

    /* ============================================================ */
    /* BATTLE PASS */
    /* ============================================================ */
    .bp-header {
        background: var(--pixel-purple);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 16px;
        margin-bottom: 12px;
        color: white;
        text-align: center;
        box-shadow: var(--pixel-shadow);
    }

    .bp-header .bp-title {
        font-size: 22px;
        margin-bottom: 6px;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 var(--pixel-border);
    }

    .bp-header .bp-timer {
        font-size: 14px;
        color: #e9d5ff;
    }

    .bp-stats {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
    }

    .bp-stats .bp-stat {
        flex: 1;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 10px;
        text-align: center;
        box-shadow: var(--pixel-shadow-sm);
    }

    .bp-stats .bp-stat .label {
        font-size: 12px;
        color: var(--pixel-hint);
        text-transform: uppercase;
    }

    .bp-stats .bp-stat .value {
        font-size: 20px;
        color: var(--pixel-green);
        font-weight: bold;
    }

    .bp-progress-bar {
        background: var(--pixel-black);
        border: 2px solid var(--pixel-border);
        border-radius: 0;
        height: 24px;
        overflow: hidden;
        margin-bottom: 6px;
    }

    .bp-progress-fill {
        height: 100%;
        background: var(--pixel-yellow);
        transition: width 0.4s steps(10);
    }

    .bp-progress-text {
        font-size: 13px;
        color: var(--pixel-hint);
        text-align: center;
        margin-bottom: 12px;
    }

    .bp-case-btn {
        background: var(--pixel-orange);
        color: white;
        font-size: 16px;
        padding: 14px;
        margin-bottom: 16px;
        border-radius: 0;
        border: 3px solid var(--pixel-border);
        cursor: pointer;
        width: 100%;
        font-family: inherit;
        box-shadow: var(--pixel-shadow);
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        transition: none;
    }

    .bp-case-btn:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .bp-case-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
        transform: translate(3px, 3px);
    }

    .bp-levels {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 40px;
    }

    .bp-level {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        box-shadow: var(--pixel-shadow-sm);
        transition: none;
    }

    .bp-level.locked {
        opacity: 0.55;
    }

    .bp-level.available {
        border-color: var(--pixel-green);
        box-shadow: 3px 3px 0 var(--pixel-dark-green);
        cursor: pointer;
    }

    .bp-level.claimed {
        background: #14532d;
        border-color: var(--pixel-green);
    }

    .bp-level .bp-lvl-num {
        font-size: 20px;
        font-weight: bold;
        min-width: 40px;
        text-align: center;
        color: var(--pixel-yellow);
    }

    .bp-level .bp-reward-info {
        flex: 1;
    }

    .bp-level .bp-reward-info .name {
        font-size: 15px;
    }

    .bp-level .bp-reward-info .sub {
        font-size: 13px;
        color: var(--pixel-hint);
    }

    .bp-level .bp-claim-btn {
        background: var(--pixel-green);
        color: var(--pixel-black);
        padding: 8px 14px;
        margin: 0;
        width: auto;
        font-size: 14px;
        border-radius: 0;
        border: 2px solid var(--pixel-border);
        cursor: pointer;
        box-shadow: var(--pixel-shadow-xs);
        font-weight: bold;
        text-transform: uppercase;
        transition: none;
    }

    .bp-level .bp-claim-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    .bp-level .bp-claim-btn:disabled {
        background: #555;
        box-shadow: none;
    }

    .bp-level .bp-check {
        font-size: 22px;
        color: var(--pixel-green);
    }

    /* ============================================================ */
    /* QUESTS */
    /* ============================================================ */
    .quest-row {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 12px;
        margin-bottom: 8px;
        box-shadow: var(--pixel-shadow-sm);
    }

    .quest-row.ready {
        border-color: var(--pixel-green);
        box-shadow: 3px 3px 0 var(--pixel-dark-green);
    }

    .quest-row .q-desc {
        font-size: 14px;
        margin-bottom: 6px;
    }

    .quest-row .q-progress-bar {
        background: var(--pixel-black);
        border: 2px solid var(--pixel-border);
        border-radius: 0;
        height: 12px;
        overflow: hidden;
        margin-bottom: 6px;
    }

    .quest-row .q-progress-fill {
        height: 100%;
        background: var(--pixel-blue);
        transition: width 0.3s steps(10);
    }

    .quest-row .q-reward {
        font-size: 13px;
        color: var(--pixel-hint);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .quest-row .q-claim-btn {
        background: var(--pixel-green);
        color: var(--pixel-black);
        padding: 6px 12px;
        margin: 0;
        width: auto;
        font-size: 13px;
        border-radius: 0;
        border: 2px solid var(--pixel-border);
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
        box-shadow: var(--pixel-shadow-xs);
        transition: none;
    }

    .quest-row .q-claim-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    .quest-row .q-claim-btn:disabled {
        background: #555;
        box-shadow: none;
    }

    /* ============================================================ */
    /* TOP TABS */
    /* ============================================================ */
    .top-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
    }

    .top-tabs .top-tab {
        flex: 1;
        padding: 10px;
        background: var(--pixel-dark);
        color: var(--pixel-text);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
        margin: 0;
        box-shadow: var(--pixel-shadow-sm);
        text-transform: uppercase;
        font-weight: bold;
        transition: none;
    }

    .top-tabs .top-tab:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .top-tabs .top-tab.active {
        background: var(--pixel-purple);
        color: white;
    }

    /* ============================================================ */
    /* БАТТЛ (БЛЭКДЖЕК) */
    /* ============================================================ */
    .battle-menu-btn {
        background: var(--pixel-purple);
        color: white;
    }

    .battle-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .bj-table {
        background: var(--pixel-black);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 20px;
        min-height: 260px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: var(--pixel-shadow);
    }

    .bj-side {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
    }

    .bj-side-title {
        font-size: 15px;
        color: var(--pixel-hint);
        text-transform: uppercase;
    }

    .bj-score {
        font-size: 22px;
        color: var(--pixel-yellow);
        font-weight: bold;
    }

    .bj-score.bust {
        color: var(--pixel-red);
    }

    .bj-cards {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        min-height: 60px;
    }

    .bj-card {
        width: 60px;
        height: 90px;
        background: var(--pixel-text);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--pixel-black);
        font-size: 13px;
        padding: 4px;
        text-align: center;
        box-shadow: var(--pixel-shadow-xs);
        transition: none;
    }

    .bj-card .bj-card-val {
        font-size: 22px;
        font-weight: bold;
        color: var(--pixel-red);
    }

    .bj-card .bj-card-name {
        font-size: 10px;
        color: #333;
        margin-top: 4px;
        word-break: break-word;
        line-height: 1.1;
    }

    .bj-card.hidden {
        background: var(--pixel-dark);
        color: var(--pixel-yellow);
    }

    .bj-card.hidden .bj-card-val {
        color: var(--pixel-yellow);
    }

    .bj-vs {
        text-align: center;
        font-size: 26px;
        color: var(--pixel-yellow);
        margin: 8px 0;
    }

    .bj-actions {

        gap: 10px;
        margin-top: 16px;

    .bj-actions button {
        flex: 1;
        margin: 0;
    }

    .bj-btn-hit { background: var(--pixel-blue); }
    .bj-btn-stand { background: var(--pixel-orange); }

    .bj-result {
        text-align: center;
        padding: 20px;
    }

    .bj-result-title {
        font-size: 28px;
        margin-bottom: 12px;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 var(--pixel-border);
    }

    .bj-result-title.win { color: var(--pixel-green); }
    .bj-result-title.lose { color: var(--pixel-red); }
    .bj-result-title.draw { color: var(--pixel-yellow); }

    .bj-waiting {
        text-align: center;
        padding: 30px;
    }

    .bj-waiting-icon {
        font-size: 60px;
        margin-bottom: 12px;
        animation: bj-spin 1s steps(4) infinite;
        display: inline-block;
    }

    @keyframes bj-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .bj-result-image {
        width: 120px;
        height: auto;
        display: block;
        margin: 12px auto;
        image-rendering: pixelated;
    }

    .bj-card-img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        image-rendering: pixelated;
    }

    /* ============================================================ */
    /* БОНУС */
    /* ============================================================ */
    .bonus-card {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 24px;
        text-align: center;
        margin-bottom: 12px;
        box-shadow: var(--pixel-shadow);
    }

    .bonus-card .bonus-amount {
        font-size: 56px;
        color: var(--pixel-green);
        margin: 10px 0;
        font-weight: bold;
    }

    .bonus-card .bonus-label {
        font-size: 15px;
        color: var(--pixel-hint);
        text-transform: uppercase;

    /* ============================================================ */

    .top-row {
        display: flex;
        align-items: center;

        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;

        margin-bottom: 8px;
        box-shadow: var(--pixel-shadow-sm);

    .top-row.top1 {
        background: #4a2d00;
        border-color: var(--pixel-yellow);
        box-shadow: 3px 3px 0 var(--pixel-yellow);
    }

    .top-row.top2 {
        background: #2d2d2d;
        border-color: #c0c0c0;
        box-shadow: 3px 3px 0 #c0c0c0;
    }

    .top-row.top3 {
        background: #4a2d00;
        border-color: #cd7f32;
        box-shadow: 3px 3px 0 #cd7f32;
    }

    .top-rank {
        font-size: 24px;
        min-width: 40px;
        text-align: center;
        font-weight: bold;
    }

    .top-info {
        flex: 1;

    .top-name {

        color: var(--pixel-hint);

    .top-balance {

        white-space: nowrap;
        font-weight: bold;
    }

    /* ============================================================ */
    /* ВОРОВСТВО */
    /* ============================================================ */
    .rob-section {
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--pixel-shadow-sm);
    }

    .rob-section .rob-title {
        font-size: 16px;
        margin-bottom: 8px;
        color: var(--pixel-hint);
        text-transform: uppercase;

        flex-wrap: wrap;
        gap: 8px;

        border: 3px solid var(--pixel-border);
        border-radius: 0;
        box-shadow: var(--pixel-shadow-xs);
        font-weight: bold;
        text-transform: uppercase;
        transition: none;
    }

    .rob-friend-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    /* МОДАЛКИ */
    /* ============================================================ */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4000;
        padding: 20px;
    }

    .modal {
        background: var(--pixel-dark);
        border: 4px solid var(--pixel-border);
        border-radius: 0;
        padding: 20px;
        width: 100%;
        max-width: 400px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 8px 8px 0 var(--pixel-border);
    }

    .modal h3 {
        font-size: 20px;
        margin-bottom: 16px;
        text-align: center;
        color: var(--pixel-yellow);
        text-transform: uppercase;
    }

    .modal-btn {
        width: 100%;
        padding: 12px;
        margin-bottom: 8px;
        font-size: 16px;
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        cursor: pointer;
        text-align: left;
        background: var(--pixel-black);
        color: var(--pixel-text);
        font-family: inherit;
        box-shadow: var(--pixel-shadow-xs);
        transition: none;
    }

    .modal-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--pixel-border);
    }

    .modal-btn.primary {
        background: var(--pixel-green);
        color: var(--pixel-black);
        text-align: center;

        text-transform: uppercase;

        padding: 12px;
        font-size: 16px;
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        background: var(--pixel-black);
        color: var(--pixel-text);
        margin-bottom: 12px;
        font-family: inherit;
    }

    .modal-input:focus {
        outline: 3px solid var(--pixel-green);
        outline-offset: 2px;
    }

    /* ============================================================ */
    /* РУЛЕТКА */
    /* ============================================================ */
    .roulette-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--pixel-black);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
    }

    .roulette-title {
        color: var(--pixel-yellow);
        font-size: 26px;
        margin-bottom: 16px;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 var(--pixel-border);
    }

    .roulette-viewport {
        width: 100%;
        max-width: 500px;
        height: 160px;
        overflow: hidden;
        position: relative;
        background: var(--pixel-black);
        border-top: 4px solid var(--pixel-yellow);
        border-bottom: 4px solid var(--pixel-yellow);
        border-radius: 0;
        box-shadow: 0 0 0 3px var(--pixel-border);
    }

    .roulette-track {
        display: flex;
        height: 100%;
        align-items: center;
        transition: transform 4s cubic-bezier(0.15, 0.7, 0.1, 1);
        will-change: transform;
    }

    .roulette-item {
        width: 130px;
        height: 140px;
        flex-shrink: 0;
        margin: 0 5px;
        background: var(--pixel-dark);
        border: 3px solid var(--pixel-border);
        border-radius: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--pixel-text);

    .preloader-bar {

    /* ============================================================ */

        max-width: 90%;

        text-transform: uppercase;
        font-weight: bold;
    }

    .toast.visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
</style>
</head>
<body>

    <div id="notif-container" class="notif-container"></div>

    <div id="preloader" class="preloader">
        <div class="preloader-inner">
            <div class="preloader-icon">🍽</div>
            <div class="preloader-title">Piggy Chef</div>
            <div class="preloader-bar">
                <div class="preloader-bar-fill" id="preloader-fill"></div>
            </div>
            <div class="preloader-status" id="preloader-status">Загрузка...</div>
            <div class="preloader-progress" id="preloader-progress">0%</div>
        </div>
    </div>

    <div class="header">
        <h1>🍽 Piggy Chef</h1>
        <div class="username" id="username">Загрузка...</div>
    </div>

    <div class="balance-bar">
        <span>💰 Баланс:</span>
        <span class="balance" id="balance-display">...</span>
    </div>

    <div class="tabs-row">
        <button class="tab active" data-tab="profile" onclick="switchTab('profile')">👤</button>
        <button class="tab" data-tab="inventory" onclick="switchTab('inventory')">🎒</button>
        <button class="tab" data-tab="battlepass" onclick="switchTab('battlepass')">🎫</button>
    </div>
    <div class="tabs-row">
        <button class="tab" data-tab="cases" onclick="switchTab('cases')">📦</button>
        <button class="tab" data-tab="top" onclick="switchTab('top')">🏆</button>
        <button class="tab" data-tab="rob" onclick="switchTab('rob')">⚔️</button>
    </div>

    <div id="content">
        <div class="loading">⏳ Загружаем данные...</div>
    </div>

    <div id="modal-root"></div>
    <div id="roulette-root"></div>
    <script>
        const API_URL = "https://piggychef.serveousercontent.com";
        const BOT_USERNAME = "piggy_chefBot";

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (tg.colorScheme === "dark") {
        document.body.classList.add("tg-dark");
        }
        tg.onEvent("themeChanged", () => {
        document.body.classList.toggle("tg-dark", tg.colorScheme === "dark");
        });

        let currentBalance = 0;
        let casesData = null;
        let robState = {};
        let notifPollingTimer = null;
        // Дедупликация уведомлений через localStorage — чтобы не показывались после перезагрузки
    function loadShownNotifIds() {
        try {
            const raw = localStorage.getItem("shown_notif_ids");
            if (raw) {
                const arr = JSON.parse(raw);
                return new Set(arr);
            }
        } catch (e) {}
        return new Set();
    }
    function saveShownNotifIds(set) {
        try {
            const arr = Array.from(set).slice(-500);
            localStorage.setItem("shown_notif_ids", JSON.stringify(arr));
        } catch (e) {}
    }
    let shownNotifIds = loadShownNotifIds();
        let bjPollingTimer = null;
    let lastBjState = null;
    let currentUserDiscount = 0;
    let currentUserRep = 0;
    let currentUserPath = "neutral";
    let currentUserIsWorker = false;

        let inventoryState = {
        offset: 0,
        limit: 20,
        totalCount: 0,
        totalValue: 0,
        items: [],
        cart: new Set(),
        sort: "price_desc",
        };

        function formatNumber(n) {
        if (!n) return "0";
        n = Number(n);
        if (n < 1000) return n.toString();
        if (n < 1000000) return (n / 1000).toFixed(1) + "K";
        if (n < 1000000000) return (n / 1000000).toFixed(1) + "M";
        if (n < 1000000000000) return (n / 1000000000).toFixed(1) + "B";
        if (n < 1000000000000000) return (n / 1000000000000).toFixed(1) + "T";
        return (n / 1000000000000000).toFixed(1) + "Qa";
        }

        function escapeJs(s) {
        if (!s) return "";
        return String(s)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");
        }
        
        function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
        }

        function imgTag(item, extraClass = "") {
        if (item && item.image_url) {
        return `<img src="${API_URL}${item.image_url}" loading="lazy" decoding="async" alt="" class="${extraClass}">`;
        }
        return `<span>${item ? item.rarity : "❓"}</span>`;
        }

        function showToast(message, duration = 2500) {
        const existing = document.getElementById("toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.id = "toast";
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add("visible"), 10);
        setTimeout(() => {
        toast.classList.remove("visible");
        setTimeout(() => toast.remove(), 400);
        }, duration);
        }

        const staticCache = new Map();
        const dynamicCache = new Map();

        async function fetchStatic(url) {
        if (staticCache.has(url)) return staticCache.get(url);
        const res = await fetch(url, { headers: { "ngrok-skip-browser-warning": "true" } });
        const data = await res.json();
        staticCache.set(url, data);
        return data;
        }

        async function fetchCached(url, ttl = 15000) {
        const now = Date.now();
        const hit = dynamicCache.get(url);
        if (hit && now - hit.time < ttl) return hit.data;
        const res = await fetch(url, { headers: { "ngrok-skip-browser-warning": "true" } });
        const data = await res.json();
        dynamicCache.set(url, { data, time: now });
        return data;
        }

        function clearDynamicCache() { dynamicCache.clear(); }
        function clearStaticCache() { staticCache.clear(); }

        function updateBalance(b) {
        currentBalance = b;
        document.getElementById("balance-display").textContent = formatNumber(b) + "₽";
        }

        function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-tab="${tab}"]`).classList.add("active");

        const oldCart = document.getElementById("cart-bar");
        if (oldCart) oldCart.remove();

        if (tab === "profile") loadProfile();
        if (tab === "inventory") loadInventory();
        if (tab === "cases") loadCases();
        if (tab === "top") loadTop();
        if (tab === "battlepass") loadBattlePass();
        if (tab === "rob") loadBattleAndRob();
        }

        // ============================================================
        // УВЕДОМЛЕНИЯ
        // ============================================================
        function renderNotification(notif) {
        const container = document.getElementById("notif-container");
        const p = notif.payload || {};
        let icon = "🔔";
        let title = "";
        let text = "";
        let actionsHtml = "";

        if (notif.type === "friend_added") {
        icon = "👥";
        title = "Новый друг";
        text = `@${escapeHtml(p.username || "игрок")} добавил тебя в друзья`;
        actionsHtml = `<button class="notif-btn close" onclick="dismissNotification(${notif.id}, this)">✕</button>`;
        } else if (notif.type === "job_invite") {
        icon = "💼";
        title = "Приглашение на работу";
        text = `@${escapeHtml(p.owner_name || "игрок")} (рест. ур. ${p.restaurant_level || 0}) приглашает поваром`;
        actionsHtml = `
        <button class="notif-btn decline" onclick="declineJob(${notif.id}, ${p.owner_id}, this)">✕</button>
        <button class="notif-btn accept" onclick="acceptJob(${notif.id}, ${p.owner_id}, this)">✓</button>
        `;
        } else if (notif.type === "gift_received") {
        icon = "🎁";
        title = "Подарок";
        text = `@${escapeHtml(p.from_name || "игрок")} подарил ${p.rarity || ""} ${escapeHtml(p.item_name || "предмет")}`;
        actionsHtml = `<button class="notif-btn close" onclick="dismissNotification(${notif.id}, this)">✕</button>`;
        } else if (notif.type === "bj_challenge") {
        icon = "🎰";
        title = "Вызов на баттл";
        text = `@${escapeHtml(p.from_name || "игрок")} вызывает тебя на ${formatNumber(p.bet || 0)}₽`;
        actionsHtml = `
        <button class="notif-btn decline" onclick="declineBj(${notif.id}, ${p.game_id}, this)">✕</button>
        <button class="notif-btn accept" onclick="acceptBj(${notif.id}, ${p.game_id}, this)">✓</button>
        `;
        } else {
        title = "Уведомление";
        text = escapeHtml(notif.type);
        actionsHtml = `<button class="notif-btn close" onclick="dismissNotification(${notif.id}, this)">✕</button>`;
        }

        const el = document.createElement("div");
        el.className = "notif";
        el.dataset.notifId = notif.id;
        el.innerHTML = `
        <div class="notif-icon">${icon}</div>
        <div class="notif-body">
        <div class="notif-title">${title}</div>
        <div class="notif-text">${text}</div>
        </div>
        <div class="notif-actions">${actionsHtml}</div>
        `;
        container.appendChild(el);
        setTimeout(() => el.classList.add("visible"), 20);

        if (notif.type !== "job_invite" && notif.type !== "bj_challenge") {
        setTimeout(() => {
        if (el.parentElement) {
        el.classList.remove("visible");
        setTimeout(() => el.remove(), 400);
        }
        }, 15000);
        }
        }

        async function markNotificationSeen(notifId) {
        try {
        await fetch(`${API_URL}/api/notification_seen`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, notification_id: notifId })
        });
        } catch (e) { }
        }

        async function dismissNotification(notifId, btn) {
        const el = btn.closest(".notif");
        if (el) { el.classList.remove("visible"); setTimeout(() => el.remove(), 400); }
        shownNotifIds.add(notifId);
        saveShownNotifIds(shownNotifIds);
        await markNotificationSeen(notifId);
        }

        async function acceptJob(notifId, ownerId, btn) {
        try {
        const res = await fetch(`${API_URL}/api/job_accept`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, owner_id: ownerId, notification_id: notifId })
        });
        const data = await res.json();
        if (data.ok) { showToast("✅ Ты принят на работу!"); dismissNotification(notifId, btn); }
        else { alert("❌ " + data.error); await markNotificationSeen(notifId); btn.closest(".notif").remove(); }
        } catch (err) { alert("❌ " + err.message); }
        }

        async function declineJob(notifId, ownerId, btn) {
        try {
        await fetch(`${API_URL}/api/job_decline`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, owner_id: ownerId, notification_id: notifId })
        });
        dismissNotification(notifId, btn);
        } catch (err) { console.error(err); }
        }

        async function acceptBj(notifId, gameId, btn) {
        try {
        const res = await fetch(`${API_URL}/api/bj_accept`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, game_id: gameId, notification_id: notifId })
        });
        const data = await res.json();
        if (data.ok) { showToast("🎰 Игра началась!"); dismissNotification(notifId, btn); switchTab("rob"); }
        else { alert("❌ " + data.error); await markNotificationSeen(notifId); btn.closest(".notif").remove(); }
        } catch (err) { alert("❌ " + err.message); }
        }

        async function declineBj(notifId, gameId, btn) {
        try {
        await fetch(`${API_URL}/api/bj_decline`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, game_id: gameId, notification_id: notifId })
        });
        dismissNotification(notifId, btn);
        } catch (err) { console.error(err); }
        }

        async function pollNotifications() {
        if (!user) return;
        try {
        const res = await fetch(`${API_URL}/api/notifications?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const data = await res.json();
        if (!data.ok) return;
        for (const notif of data.notifications) {
        if (shownNotifIds.has(notif.id)) continue;
        shownNotifIds.add(notif.id);
        saveShownNotifIds(shownNotifIds);
                renderNotification(notif);
        }
        } catch (e) { }
        }

        function startNotificationPolling() {
        if (notifPollingTimer) return;
        pollNotifications();
        notifPollingTimer = setInterval(pollNotifications, 5000);
        }

        // ============================================================
        // ПРОФИЛЬ
        // ============================================================
        async function loadProfile() {
    if (!user) {

        // BATTLE PASS

        let bpState = { season: null, progress: null };

        async function loadBattlePass() {
        if (!user) return;
        document.getElementById("username").textContent = `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML = '<div class="loading">⏳ Загружаем Баттл Пасс...</div>';

        try {
        const sRes = await fetch(`${API_URL}/api/season/current`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const sData = await sRes.json();
        if (!sData.ok) throw new Error(sData.error || "нет сезона");

        const pRes = await fetch(`${API_URL}/api/season/progress?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const pData = await pRes.json();
        if (!pData.ok) throw new Error(pData.error);

        const qRes = await fetch(`${API_URL}/api/season/quests?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const qData = await qRes.json();
        const quests = qData.ok ? qData.quests : [];

        try {
        await fetch(`${API_URL}/api/season/daily_login`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id })
        });
        } catch (e) {}

        bpState.season = sData.season;
        bpState.progress = pData;
        renderBattlePass(sData.season, pData, quests);
        } catch (err) {
        document.getElementById("content").innerHTML = `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
        }

        function formatTimeLeft(sec) {
        const d = Math.floor(sec / 86400);
        const h = Math.floor((sec % 86400) / 3600);
        const m = Math.floor((sec % 3600) / 60);
        if (d > 0) return `${d}д ${h}ч ${m}м`;
        if (h > 0) return `${h}ч ${m}м`;
        return `${m}м`;
        }

        function renderBattlePass(season, prog, quests) {
        const { level, bp_xp, xp_in_level, xp_needed, season_coins, case_price, rewards, passive_xp_per_hour, free_cases } = prog;

        const percent = xp_needed > 0 ? Math.min(100, Math.round((xp_in_level / xp_needed) * 100)) : 0;

        let html = `
        <div class="bp-header">
        <div class="bp-title">${season.emoji} ${escapeHtml(season.name)}</div>
        <div class="bp-timer">⏳ До конца: ${formatTimeLeft(season.seconds_left)}</div>
        </div>

        <div class="bp-stats">
        <div class="bp-stat">
        <div class="label">Уровень</div>
        <div class="value">${level} / 100</div>
        </div>
        <div class="bp-stat">
        <div class="label">🎃 Тыквы</div>
        <div class="value">${season_coins}</div>
        </div>
        ${free_cases > 0 ? `
        <div class="bp-stat" style="background: rgba(39,174,96,0.15);">
        <div class="label">🎁 Бесплатных</div>
        <div class="value" style="color:#27ae60;">${free_cases}</div>
        </div>` : ''}
        </div>

        <div class="card">
        <div class="label">Опыт БП</div>
        <div class="bp-progress-bar"><div class="bp-progress-fill" style="width:${percent}%"></div></div>
        <div class="bp-progress-text">${xp_in_level} / ${xp_needed} XP (${percent}%)</div>
        ${passive_xp_per_hour > 0 ? `<div style="font-size:14px;color:#27ae60;text-align:center;">+${passive_xp_per_hour} XP/час с сезонных блюд</div>` : ''}
        </div>

        ${free_cases > 0
        ? `<button class="bp-case-btn" onclick="openSeasonCase()" style="background: linear-gradient(135deg, #27ae60, #2ecc71);">
        🎁 Открыть сезонный кейс (бесплатно ×${free_cases})
        </button>`
        : `<button class="bp-case-btn" onclick="openSeasonCase()" ${season_coins < case_price ? 'disabled' : ''}>
        🎁 Открыть сезонный кейс (${case_price} 🎃)
        </button>`
        }

        <div class="card"><div class="label">📋 Ежедневные задания</div></div>
        `;

        for (const q of quests) {
        const qPercent = q.target > 0 ? Math.min(100, Math.round((q.progress / q.target) * 100)) : 0;
        const ready = q.can_claim;
        html += `
        <div class="quest-row ${ready ? 'ready' : ''}">
        <div class="q-desc">${escapeHtml(q.desc)}</div>
        <div class="q-progress-bar"><div class="q-progress-fill" style="width:${qPercent}%"></div></div>
        <div class="q-reward">
        <span>${q.progress} / ${q.target} · +${q.reward_xp} XP</span>
        <button class="q-claim-btn" onclick="claimQuest(${q.id})" ${ready ? '' : 'disabled'}>
        ${ready ? '🎁 Забрать' : '⏳'}
        </button>
        </div>
        </div>
        `;
        }

        html += `<div class="card" style="margin-top:16px;"><div class="label">🏆 Награды за уровни</div></div>`;
        html += `<div class="bp-levels">`;

        for (const r of rewards) {
        const { level: lvl, reward, coins, claimed, available } = r;
        let rowClass = "";
        let rewardText = "";
        let subText = `+${coins} 🎃`;

        if (claimed) rowClass = "claimed";
        else if (available) rowClass = "available";
        else rowClass = "locked";

        if (reward.type === "money") {
        rewardText = `💰 ${formatNumber(reward.amount)}₽`;
        } else if (reward.type === "season_case") {
        rewardText = `🎁 Сезонный кейс ×${reward.count}`;
        } else if (reward.type === "season_dish") {
        rewardText = `🍽 Сезонное блюдо (${reward.code})`;
        }

        let actionHtml = "";
        if (claimed) {
        actionHtml = `<span class="bp-check">✅</span>`;
        } else if (available) {
        actionHtml = `<button class="bp-claim-btn" onclick="claimBpLevel(${lvl})">🎁 Забрать</button>`;
        } else {
        actionHtml = `<span style="color:#999;font-size:14px;">🔒</span>`;
        }

        html += `
        <div class="bp-level ${rowClass}" onclick="${available ? `claimBpLevel(${lvl})` : ''}">
        <div class="bp-lvl-num">${lvl}</div>
        <div class="bp-reward-info">
        <div class="name">${rewardText}</div>
        <div class="sub">${subText}</div>
        </div>
        ${actionHtml}
        </div>
        `;
        }

        html += `</div>`;

        document.getElementById("content").innerHTML = html;

        setTimeout(() => {
        const firstAvailable = document.querySelector(".bp-level.available");
        if (firstAvailable) {
        firstAvailable.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        }, 100);
        }

        async function claimBpLevel(level) {
        try {
        const res = await fetch(`${API_URL}/api/season/claim`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, level })
        });
        const data = await res.json();
        if (data.ok) {
        showToast(`🎁 Уровень ${level}: ${data.message}`);
        if (data.new_balance !== undefined) updateBalance(data.new_balance);
        clearDynamicCache();
        loadBattlePass();
        } else {
        alert("❌ " + data.error);
        }
        } catch (err) { alert("❌ Ошибка: " + err.message); }
        }

        async function claimQuest(questId) {
        try {
        const res = await fetch(`${API_URL}/api/season/quest_claim`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, quest_id: questId })
        });
        const data = await res.json();
        if (data.ok) {
        showToast(`🎁 +${data.reward_xp} XP`);
        loadBattlePass();
        } else {
        alert("❌ " + data.error);
        }
        } catch (err) { alert("❌ Ошибка: " + err.message); }
        }

        async function openSeasonCase() {
        if (!confirm("🎁 Открыть сезонный кейс?")) return;

        try {
        const previewRes = await fetch(`${API_URL}/api/season/case_preview`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const previewData = await previewRes.json();
        if (!previewData.ok) { alert("❌ " + previewData.error); return; }
        const pool = previewData.pool;
        if (!pool || pool.length === 0) { alert("❌ Пул пуст"); return; }

        const res = await fetch(`${API_URL}/api/season/open_case`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id })
        });
        const data = await res.json();
        if (!data.ok) { alert("❌ " + data.error); return; }

        showSeasonCaseRoulette(pool, data.item, () => {
        loadBattlePass();
        });
        } catch (err) { alert("❌ Ошибка: " + err.message); }
        }

        function showSeasonCaseRoulette(pool, item, onDone) {
        const rouletteRoot = document.getElementById("roulette-root");
        const RANDOM_BEFORE = 40, TOTAL_ITEMS = 60;

        let targetIndex = 0;
        for (let i = 0; i < pool.length; i++) {
        if (pool[i].code === item.code || pool[i].name === item.name) {
        targetIndex = i;
        break;
        }
        }

        const strip = [];
        for (let i = 0; i < RANDOM_BEFORE; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);
        strip.push(pool[targetIndex]);
        for (let i = 0; i < TOTAL_ITEMS - RANDOM_BEFORE - 1; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);

        let trackHtml = "";
        for (const p of strip) {
        trackHtml += `<div class="roulette-item">${imgTag(p, "r-emoji")}<div class="r-name">${escapeHtml(p.name)}</div></div>`;
        }

        rouletteRoot.innerHTML = `
        <div class="roulette-container">
        <div class="roulette-title">🎃 Сезонный кейс</div>
        <div class="roulette-viewport">
        <div class="roulette-pointer"></div>
        <div class="roulette-track" id="roulette-track">${trackHtml}</div>
        </div>
        </div>
        `;

        const ITEM_WIDTH = 140;
        const viewportWidth = Math.min(window.innerWidth - 40, 500);
        const pointerPos = viewportWidth / 2;
        const winningCenter = RANDOM_BEFORE * ITEM_WIDTH + ITEM_WIDTH / 2;
        const offset = winningCenter - pointerPos;
        const randomShift = (Math.random() - 0.5) * 60;
        const finalOffset = offset + randomShift;

        setTimeout(() => {
        const track = document.getElementById("roulette-track");
        if (track) track.style.transform = `translateX(-${finalOffset}px)`;
        }, 100);

        setTimeout(() => {
        closeRoulette();
        showToast(`🎁 ${item.rarity} ${item.name}`);
        if (onDone) onDone();
        }, 4300);
        }

        async function loadTop() {
        document.getElementById("username").textContent = `${user.first_name} (@${user.username || "no_username"})`;

        let html = `
        <div class="top-tabs">
        <button class="top-tab ${topActiveTab === 'overall' ? 'active' : ''}" onclick="switchTopTab('overall')">🏆 Общий</button>
        <button class="top-tab ${topActiveTab === 'season' ? 'active' : ''}" onclick="switchTopTab('season')">🎃 Сезон</button>
        </div>
        <div id="top-content"><div class="loading">⏳</div></div>
        `;
        document.getElementById("content").innerHTML = html;
        await renderTopContent();

        function switchTopTab(tab) {
        topActiveTab = tab;
        loadTop();
        }

        async function renderTopContent() {
        const el = document.getElementById("top-content");
        try {
        if (topActiveTab === "overall") {
        const data = await fetchCached(`${API_URL}/api/top`, 30000);
        if (!data.ok) throw new Error(data.error);
        let html = "";
        for (let i = 0; i < data.top.length; i++) {
        const u = data.top[i];
        const rank = i + 1;
        let medal = '', rowClass = '';
        if (rank === 1) { medal = '🥇'; rowClass = 'top1'; }
        else if (rank === 2) { medal = '🥈'; rowClass = 'top2'; }
        else if (rank === 3) { medal = '🥉'; rowClass = 'top3'; }
        else { medal = `#${rank}`; }
        let name = u.username ? `@${u.username}` : (u.first_name || `id${u.user_id}`);
        if (u.has_crown) name = '👑 ' + name;
        if (u.reputation >= 100) name = '😇 ' + name;
        else if (u.reputation <= -100) name = '🎭 ' + name;
        html += `
        <div class="top-row ${rowClass}">
        <div class="top-rank">${medal}</div>
        <div class="top-info">
        <div class="top-name">${escapeHtml(name)}</div>
        <div class="top-stats">Ур. ${u.level} · ✨ ${formatNumber(u.xp)} XP</div>
        </div>
        <div class="top-balance">${formatNumber(u.balance)}₽</div>
        </div>
        `;
        }
        el.innerHTML = html || '<div class="card"><div class="label">Пусто</div></div>';
        } else {
        const data = await fetchCached(`${API_URL}/api/season/top`, 15000);
        if (!data.ok) throw new Error(data.error);
        let html = "";
        for (let i = 0; i < data.top.length; i++) {
        const u = data.top[i];
        const rank = i + 1;
        let medal = '', rowClass = '';
        if (rank === 1) { medal = '🥇'; rowClass = 'top1'; }
        else if (rank === 2) { medal = '🥈'; rowClass = 'top2'; }
        else if (rank === 3) { medal = '🥉'; rowClass = 'top3'; }
        else { medal = `#${rank}`; }
        let name = u.username ? `@${u.username}` : (u.first_name || `id${u.user_id}`);
        html += `
        <div class="top-row ${rowClass}">
        <div class="top-rank">${medal}</div>
        <div class="top-info">
        <div class="top-name">${escapeHtml(name)}</div>
        <div class="top-stats">Ур. БП ${u.level} · ✨ ${formatNumber(u.bp_xp)} XP</div>
        </div>
        <div class="top-balance">🎃 ${u.season_coins}</div>
        </div>
        `;
        }
        el.innerHTML = html || '<div class="card"><div class="label">Пусто</div></div>';
        }
        } catch (err) {
        el.innerHTML = `<div class="error">❌ ${escapeHtml(err.message)}</div>`;

        const res = await fetch(`${API_URL}/api/restaurant?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }

        updateBalance(r.balance);

        let html = `<button class="btn-back" onclick="loadProfile()">⬅️ Назад в профиль</button>`;

        if (r.image) html += `<img src="${API_URL}${r.image}" class="restaurant-image" alt="Ресторан" loading="lazy" decoding="async">`;
        else html += `<div class="restaurant-image-placeholder">🏪</div>`;

        html += `<div class="card"><div class="label">🏪 Ресторан</div><div class="value">Уровень ${r.level} / 10</div></div>`;

        if (r.level > 0) {

        async function submitBjManual() {
        const input = document.getElementById("bj-manual-input");

        function renderBjScreen(game) {
        lastBjState = game;

        if (game.status === "pending") {
        renderBjWaiting({ bet: game.bet, opponent_name: game.their.name });
        return;
        }

        if (game.status === "playing") {
        renderBjPlaying(game);
        startBjPolling();
        return;
        }

        if (game.status === "awaiting_rematch") {
        renderBjResult(game);
        stopBjPolling();
        return;
        }
        }

        function renderBjPlaying(game) {
        const me = game.my;
        const their = game.their;

        const myCardsHtml = me.cards.map(c => renderBjCard(c, false)).join("");
        const theirCardsHtml = their.cards.map(c => renderBjCard(c, true)).join("");

        const myScoreClass = me.bust ? "bust" : "";
        const theirScoreClass = their.bust ? "bust" : "";

        const theirDone = their.stand || their.bust;
        const theirScoreDisplay = theirDone
        ? `${their.score} / 21${their.bust ? " 💥" : ""}${their.stand ? " ✋" : ""}`
        : "? / 21";

        let actionsHtml = "";
        if (!me.stand && !me.bust) {
        actionsHtml = `
        <div class="bj-actions">
        <button class="bj-btn-hit" onclick="bjHit()">🃏 Взять</button>
        <button class="bj-btn-stand" onclick="bjStand()">✋ Хватит</button>
        </div>
        `;
        } else {
        actionsHtml = `<div style="text-align:center;color:#999;padding:16px;">Ожидаем ход соперника...</div>`;
        }

        <div class="bj-cards">${myCardsHtml}</div>

        <div class="bj-side-title">👤 Ты</div>
        </div>
        </div>

        document.getElementById("content").innerHTML = html;

        function renderBjCard(cardName, hidden) {
        if (hidden) {
        return `<div class="bj-card hidden"><div class="bj-card-val">?</div></div>`;
        }
        return `
        <div class="bj-card">
        <div class="bj-card-val">${getBjCardValue(cardName)}</div>
        <div class="bj-card-name">${escapeHtml(cardName)}</div>

        function getBjCardValue(name) {
        const values = {
        "Крошка хлеба": 1, "Кусок хлеба": 2, "Гренка": 3,
        "Варёное яйцо": 4, "Овсянка": 5, "Макароны": 6,
        "Картошка": 7, "Сосиска": 8, "Салат из огурцов": 9,
        "Помидор": 10, "Лук": 11, "Чеснок": 12,
        "Вареники": 2, "Сырники": 3, "Драники": 4,
        "Пельмени": 5, "Блины": 6, "Борщ": 7,
        "Плов": 8, "Котлета по-киевски": 9, "Шаурма": 10,
        "Гречка с мясом": 11,
        };
        return values[name] || "?";

        const res = await fetch(`${API_URL}/api/bj_state?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const data = await res.json();
        if (data.ok && data.game) {
        renderBjScreen(data.game);
        if (data.game.status === "awaiting_rematch") {
        stopBjPolling();

        } else {
        stopBjPolling();
        loadBattleAndRob();

        function startBjPolling() {
        if (bjPollingTimer) return;

        if (bjPollingTimer) {
        clearInterval(bjPollingTimer);

        function renderBjResult(game) {
        const me = game.my;
        const their = game.their;

        let image = null;

        if (game.winner_id === null) {
        title = "🤝 Ничья!";
