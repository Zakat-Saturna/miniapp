        async function loadRob() {
        document.getElementById("content").innerHTML = '<div class="loading">⏳ Загружаем воровство...</div>';
        try {
        const statRes = await fetch(`${API_URL}/api/rob_status?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const stat = await statRes.json();
        if (!stat.ok) throw new Error(stat.error);

        let html = `<button class="btn-back" onclick="loadBattleAndRob()">⬅️ Назад</button>`;

        if (!stat.can_steal) {
        html += `<div class="card"><div class="label">⚔️ Воровство</div><div style="font-size:17px;color:#999;margin-top:8px;">Доступно с ${stat.min_level} уровня. У тебя — ${stat.level}.</div></div>`;
        document.getElementById("content").innerHTML = html;
        return;
        }

        if (stat.cooldown_left > 0) {
        html += `<div class="card"><div class="label">⚔️ Воровство</div><div style="font-size:17px;color:#999;margin-top:8px;">⏳ Кулдаун: осталось ${stat.cooldown_left} мин.</div></div>`;
        document.getElementById("content").innerHTML = html;
        return;
        }

        html += `<div class="card"><div class="label">⚔️ Воровство</div><div style="font-size:16px;color:#999;margin-top:6px;">Выбери жертву из друзей или введи @username</div></div>`;

        const frRes = await fetch(`${API_URL}/api/rob_friends?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        });
        const frData = await frRes.json();

        if (frData.ok && frData.friends.length > 0) {
        html += `<div class="rob-section"><div class="rob-title">👥 Друзья</div><div class="rob-btn-row">`;
        for (const f of frData.friends) {
        const name = f.first_name || f.username || `id${f.user_id}`;
        html += `<button class="rob-friend-btn" onclick="selectVictim(${f.user_id}, '${escapeHtml(name)}')">⚔️ ${escapeHtml(name)}</button>`;
        }
        html += `</div></div>`;
        } else {
        html += `<div class="card"><div class="label">👥 Друзей нет</div></div>`;
        }

        html += `<button onclick="manualVictim()">✏️ Ввести @username / ID</button>`;

        document.getElementById("content").innerHTML = html;
        } catch (err) {
        document.getElementById("content").innerHTML = `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
        }

        function manualVictim() {
        const raw = prompt("Введи @username или ID игрока:");
        if (!raw) return;
        selectVictim(null, null, raw.trim());
        }

        async function selectVictim(victimId, victimName, rawInput) {
        document.getElementById("content").innerHTML = '<div class="loading">⏳ Ищем жертву...</div>';
        try {
        let url;
        if (victimId) {
        url = `${API_URL}/api/victim_inventory?victim_id=${victimId}`;
        } else {
        let cleanRaw = rawInput;
        if (cleanRaw.startsWith("@")) cleanRaw = cleanRaw.slice(1);
        const searchUrl = /^\d+$/.test(cleanRaw)
        ? `${API_URL}/api/rob_search?by_id=${cleanRaw}`
        : `${API_URL}/api/rob_search?username=${encodeURIComponent(cleanRaw)}`;
        const searchRes = await fetch(searchUrl, { headers: { "ngrok-skip-browser-warning": "true" } });
        const searchData = await searchRes.json();
        if (!searchData.ok) { alert("❌ " + searchData.error); loadRob(); return; }
        victimId = searchData.user_id;
        url = `${API_URL}/api/victim_inventory?victim_id=${victimId}`;
        }

        const res = await fetch(url, { headers: { "ngrok-skip-browser-warning": "true" } });
        const data = await res.json();
        if (!data.ok) { alert("❌ " + data.error); loadRob(); return; }

        if (data.items.length === 0) { alert("🛡 У жертвы нет доступных предметов"); loadRob(); return; }

        robState.victimId = victimId;
        robState.victimName = data.victim_name;
        robState.victimItems = data.items;

        renderVictimItems();
        } catch (err) {

        async function doSteal(thiefItemCode) {
        try {

        function showStealRoulette(result) {
        const rouletteRoot = document.getElementById("roulette-root");
        const RANDOM_BEFORE = 35;
        const TOTAL_ITEMS = 55;
        const strip = [];
        const pool = [];
        for (let i = 0; i < 10; i++) {
        pool.push({ name: result.thief_item.name, rarity: result.thief_item.rarity });
        pool.push({ name: result.victim_item.name, rarity: result.victim_item.rarity });
        }
        for (let i = 0; i < RANDOM_BEFORE; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);
        strip.push({
        name: result.success ? result.victim_item.name : result.thief_item.name,
        rarity: result.success ? result.victim_item.rarity : result.thief_item.rarity,
        });
        for (let i = 0; i < TOTAL_ITEMS - RANDOM_BEFORE - 1; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);

        let trackHtml = "";
        for (const item of strip) {
        trackHtml += `
        <div class="roulette-item">
        <span class="r-emoji">${item.rarity}</span>
        <div class="r-name">${escapeHtml(item.name)}</div>
        </div>
        `;
        }

        const title = result.success ? '⚔️ Победа!' : '💀 Провал...';
        rouletteRoot.innerHTML = `
        <div class="roulette-container">
        <div class="roulette-title">${title}</div>
        <div class="roulette-viewport">
        <div class="roulette-pointer"></div>
        <div class="roulette-track" id="roulette-track">${trackHtml}</div>
        </div>
        </div>
        `;

        const ITEM_WIDTH = 140;
        const viewportWidth = Math.min(window.innerWidth - 40, 500);
        const pointerPos = viewportWidth / 2;
        const winningCenter = RANDOM_BEFORE * ITEM_WIDTH + ITEM_WIDTH / 2;
        const offset = winningCenter - pointerPos;
        const randomShift = (Math.random() - 0.5) * 60;
        const finalOffset = offset + randomShift;

        setTimeout(() => {
        const track = document.getElementById("roulette-track");
        if (track) track.style.transform = `translateX(-${finalOffset}px)`;
        }, 100);
        setTimeout(() => showStealResult(result), 4300);
        }

        function showStealResult(result) {
        const rouletteRoot = document.getElementById("roulette-root");
        let header, detail, color;
        if (result.success) {
        header = "🏆 Победа!";
        detail = `Ты украл ${result.victim_item.rarity} <b>${escapeHtml(result.victim_item.name)}</b> (${formatNumber(result.victim_item.price)}₽)`;
        color = "#27ae60";
        } else {
        header = "💀 Провал";
        detail = `Ты проиграл свою ставку ${result.thief_item.rarity} <b>${escapeHtml(result.thief_item.name)}</b> (${formatNumber(result.thief_item.price)}₽)`;
        color = "#e74c3c";
        }
        rouletteRoot.innerHTML = `
        <div class="result-container">
        <div class="result-header" style="color: ${color};">${header}</div>
        <div style="font-size: 19px; margin-bottom: 20px; line-height: 1.4;">
        ${detail}<br><br>🎲 Шанс победы: ${result.chance}%
        </div>
        <div class="result-buttons">
        <button class="result-btn again" onclick="closeRoulette(); loadRob()">⚔️ Ещё раз</button>

        async function loadInventory() {

        async function fetchInventoryPage(offset) {
        document.getElementById("content").innerHTML = '<div class="loading">⏳ Загружаем инвентарь...</div>';
        try {
        const res = await fetch(
        `${API_URL}/api/inventory?user_id=${user.id}&offset=${offset}&limit=${inventoryState.limit}&sort=${inventoryState.sort}`,
        { headers: { "ngrok-skip-browser-warning": "true" } }
        );
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        inventoryState.offset = data.offset;
        inventoryState.totalCount = data.total_count;
        inventoryState.totalValue = data.total_value;
        inventoryState.items = data.items;
        renderInventory();
        } catch (err) {
        document.getElementById("content").innerHTML = `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;

        function renderInventory() {
        const { items, offset, limit, totalCount, totalValue, cart } = inventoryState;
        if (totalCount === 0) {
        document.getElementById("content").innerHTML = '<div class="card"><div class="label">🎒 Инвентарь пуст</div></div>';
        return;
        }

        let html = `
        <div class="inv-header"><div>🎒 Всего: ${totalCount}</div><div class="total-value">💰 ${formatNumber(totalValue)}₽</div></div>
        <div class="sort-bar">
        <button class="sort-btn ${inventoryState.sort === 'price_desc' ? 'active' : ''}" onclick="changeSort('price_desc')">💰 Дорогие</button>

        <button class="sort-btn ${inventoryState.sort === 'new' ? 'active' : ''}" onclick="changeSort('new')">🆕 Новые</button>
        <button class="sort-btn ${inventoryState.sort === 'old' ? 'active' : ''}" onclick="changeSort('old')">🕐 Старые</button>
        </div>
        `;

        for (const item of items) {
        const isSelected = cart.has(item.code);
        const isArtifact = item.is_artifact;
        const isSeason = item.is_season;

        const insuredBtn = item.insured
        ? `<button class="btn-tiny btn-tiny-insure disabled" disabled>🛡</button>`
        : `<button class="btn-tiny btn-tiny-insure" onclick="insureItem('${item.code}')">🛡</button>`;

        let checkboxHtml;
        if (isArtifact) {
        checkboxHtml = `<div class="item-checkbox-placeholder">⭐</div>`;
        } else if (isSeason) {
        checkboxHtml = `<div class="item-checkbox-placeholder">🎃</div>`;
        } else {
        checkboxHtml = `<div class="item-checkbox ${isSelected ? 'checked' : ''}" onclick="toggleCart('${item.code}')">${isSelected ? '✓' : ''}</div>`;
        }

        const actionsHtml = isArtifact
        ? `<button class="btn-tiny btn-tiny-gift" onclick="giftItem('${item.code}')">🎁</button>`
        : `${insuredBtn}<button class="btn-tiny btn-tiny-gift" onclick="giftItem('${item.code}')">🎁</button>`;

        html += `
        <div class="item ${isSelected ? 'selected' : ''} ${isSeason ? 'is-season' : ''}">
        ${checkboxHtml}
        <div class="item-img">${imgHtml}</div>
        <div class="item-info">
        <div class="item-name">${item.rarity} ${escapeHtml(item.name)}</div>
        <div class="item-price">${formatNumber(item.price)}₽</div>
        <div class="item-code">${item.code}${item.insured ? ' 🛡' : ''}${isArtifact ? ' ⭐' : ''}${isSeason ? ' 🎃 сезонное' : ''}</div>
        </div>
        <div class="item-actions">${actionsHtml}</div>
        </div>
        `;
        }

        const currentPage = Math.floor(offset / limit) + 1;
        const totalPages = Math.ceil(totalCount / limit);

        html += `
        <div class="inv-pagination">
        <button onclick="changePage(-1)" ${offset === 0 ? 'disabled' : ''}>⬅️</button>
        <div class="page-info">${currentPage} / ${totalPages}</div>
        <button onclick="changePage(1)" ${offset + limit >= totalCount ? 'disabled' : ''}>➡️</button>
        </div>
        <button class="sell-all-btn" onclick="sellInventory()">💵 Продать ВСЁ (кроме артефактов и застрахованных)</button>
        `;

        document.getElementById("content").innerHTML = html;
        renderCartBar();
        }

        function changeSort(newSort) {
        inventoryState.sort = newSort;
        inventoryState.offset = 0;
        fetchInventoryPage(0);
        }

        function changePage(delta) {
        const newOffset = inventoryState.offset + delta * inventoryState.limit;
        if (newOffset < 0 || newOffset >= inventoryState.totalCount) return;
        fetchInventoryPage(newOffset);
        }

        function toggleCart(code) {
        const cart = inventoryState.cart;
        if (cart.has(code)) cart.delete(code);
        else cart.add(code);
        renderInventory();
        }

        function renderCartBar() {
        const oldCart = document.getElementById("cart-bar");
        if (oldCart) oldCart.remove();
        const cart = inventoryState.cart;
        if (cart.size === 0) return;
        let total = 0;
        for (const item of inventoryState.items) {
        if (cart.has(item.code)) total += item.price;
        }
        const cartBar = document.createElement("div");
        cartBar.className = "cart-bar";
        cartBar.id = "cart-bar";
        cartBar.innerHTML = `
        <div class="cart-info">
        <div>🛒 В корзине: ${cart.size}</div>
        <div>💰 Всего: <span class="cart-total">${formatNumber(total)}₽</span></div>
        </div>
        <button class="cart-btn" onclick="sellCart()">💵 Продать</button>
        `;
        document.body.appendChild(cartBar);
        }

        async function sellCart() {
        const cart = inventoryState.cart;
        if (cart.size === 0) return;
        if (!confirm(`💵 Продать ${cart.size} предметов?`)) return;
        try {
        const res = await fetch(`${API_URL}/api/sell_bulk`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, codes: Array.from(cart) })
        });
        const data = await res.json();
        if (data.ok) {

        cart.clear();
        clearDynamicCache();
        fetchInventoryPage(inventoryState.offset);
        } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
        }

        if (!confirm("💵 Продать ВСЁ, кроме застрахованных и артефактов?")) return;

        clearDynamicCache();
        fetchInventoryPage(0);
        } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }

        async function insureItem(code) {

        function giftItem(code) {

        })
        .then(r => r.json())

        function showGiftModal(code, friends) {

        modalRoot.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal">
        <h3>🎁 Введи @username</h3>

        <button class="modal-btn primary" onclick="sendGiftByUsername('${code}')">✅ Отправить</button>

        function sendGiftByUsername(code) {
        const input = document.getElementById("gift-username-input");
        const value = input.value.trim().replace("@", "");
        if (!value) { alert("❌ Введи username или ID"); return; }
        const isId = /^\d+$/.test(value);
        if (isId) sendGift(code, parseInt(value), null);
        else sendGift(code, null, value);

        async function sendGift(code, toUserId, toUsername) {
        closeModal();
        const body = { user_id: user.id, item_code: code };
        if (toUserId) body.to_user_id = toUserId;

        body: JSON.stringify(body)
        });

        if (data.ok) {
        clearDynamicCache();
        fetchInventoryPage(inventoryState.offset);
        } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
        }

        function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

        async function loadCases() {
        if (!user) return;
        document.getElementById("username").textContent = `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML = '<div class="loading">⏳ Загружаем кейсы...</div>';
        try {
        const res = await fetch(`${API_URL}/api/cases?user_id=${user.id}`, {

            });

        function renderCategories() {
        let html = '<div class="card"><div class="label">📦 Выбери категорию</div></div>';
        for (const cat of casesData) {
        html += `<div class="case-category" onclick="renderCaseList('${cat.id}')"><span>${escapeHtml(cat.name)}</span><span>▶️</span></div>`;

        function renderCaseList(catId) {
        const cat = casesData.find(c => c.id === catId);
        if (!cat) return;
        let html = `<button class="btn-back" onclick="renderCategories()">⬅️ Назад к категориям</button>`;

        for (const c of cat.cases) {
        html += `
        <div class="case-item">
        <div class="case-name">${escapeHtml(c.name)}</div>
        ${(() => {
                        const d = c.discount || currentUserDiscount || 0;
                        const rp = c.real_price || c.price;
                        if (d > 0 && rp < c.price) {
                            return `<div class="case-price"><span style="text-decoration: line-through; color:#999;">${formatNumber(c.price)}₽</span> <b style="color:#27ae60;">${formatNumber(rp)}₽</b> <span style="color:#27ae60;font-size:14px;">(−${d}%)</span></div>`;
                        }
                        return `<div class="case-price">${formatNumber(c.price)}₽</div>`;
                    })()}
        <div class="case-buttons">
        <button class="btn-case btn-x1" onclick="openCase('${c.id}', 1)">×1</button>

        async function openCase(caseId, count) {
        if (!user) return;
        let casePrice = 0;
        for (const cat of casesData) {
        for (const c of cat.cases) {
        if (c.id === caseId) {
            // используем реальную цену со скидкой
            casePrice = c.real_price !== undefined ? c.real_price : c.price;
            break;
        }
        }
        }
const total = casePrice * count;
        if (currentBalance < total) {
        alert(`❌ Нужно ${formatNumber(total)}₽, у тебя ${formatNumber(currentBalance)}₽`);
        return;
        }

        let pool = [], caseName = "";
        try {
        const data = await fetchStatic(`${API_URL}/api/case_preview?case_id=${caseId}`);
        if (!data.ok) { alert("❌ " + data.error); return; }
        pool = data.pool || [];
        caseName = data.case_name || "";
        } catch (err) { alert("❌ " + err.message); return; }

        if (pool.length === 0) { alert("❌ Кейс пустой"); return; }

        let openResult;
        try {
        const res = await fetch(`${API_URL}/api/open_case`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, case_id: caseId, count })
        });
        openResult = await res.json();
        if (!openResult.ok) { alert("❌ " + openResult.error); return; }
        } catch (err) { alert("❌ " + err.message); return; }

        updateBalance(openResult.new_balance);
        clearDynamicCache();

        if (count === 1) {
        showSingleBigRoulette(caseName, pool, openResult.results[0], () => {
        showMultiResult(openResult.results, caseId, count);
        });
        } else {
        showAllMiniRoulettes(caseName, count, pool, openResult.results, () => {
        showMultiResult(openResult.results, caseId, count);
        });
        }
        }

        function showSingleBigRoulette(caseName, pool, result, onDone) {
        const rouletteRoot = document.getElementById("roulette-root");
        const targetIndex = result.pool_index !== undefined ? result.pool_index : Math.floor(Math.random() * pool.length);
        const RANDOM_BEFORE = 40, TOTAL_ITEMS = 60;
        const strip = [];
        for (let i = 0; i < RANDOM_BEFORE; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);
        strip.push(pool[targetIndex]);
        for (let i = 0; i < TOTAL_ITEMS - RANDOM_BEFORE - 1; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);

        let trackHtml = "";
        for (const item of strip) {
        trackHtml += `<div class="roulette-item">${imgTag(item, "r-emoji")}<div class="r-name">${escapeHtml(item.name)}</div></div>`;
        }

        rouletteRoot.innerHTML = `
        <div class="roulette-container">
        <div class="roulette-title">🎰 ${escapeHtml(caseName)}</div>
        <div class="roulette-viewport">
        <div class="roulette-pointer"></div>
        <div class="roulette-track" id="roulette-track">${trackHtml}</div>
        </div>
        </div>
        `;

        const ITEM_WIDTH = 140;
        const viewportWidth = Math.min(window.innerWidth - 40, 500);
        const pointerPos = viewportWidth / 2;
        const winningCenter = RANDOM_BEFORE * ITEM_WIDTH + ITEM_WIDTH / 2;
        const offset = winningCenter - pointerPos;
        const randomShift = (Math.random() - 0.5) * 60;
        const finalOffset = offset + randomShift;

        setTimeout(() => {
        const track = document.getElementById("roulette-track");
        if (track) track.style.transform = `translateX(-${finalOffset}px)`;
        }, 100);
        setTimeout(onDone, 4300);
        }

        function showAllMiniRoulettes(caseName, count, pool, results, onDone) {
        const rouletteRoot = document.getElementById("roulette-root");
        const isTwoCols = count >= 6;
        const listClass = isTwoCols ? "multi-roulette-list cols-2" : "multi-roulette-list cols-1";
        let roulettesHtml = "";
        const configs = [];

        for (let idx = 0; idx < count; idx++) {
        const result = results[idx];
        const targetIndex = result.pool_index !== undefined ? result.pool_index : Math.floor(Math.random() * pool.length);
        const RANDOM_BEFORE = 30, TOTAL_ITEMS = 45;
        const strip = [];
        for (let i = 0; i < RANDOM_BEFORE; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);
        strip.push(pool[targetIndex]);
        for (let i = 0; i < TOTAL_ITEMS - RANDOM_BEFORE - 1; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);

        let trackHtml = "";
        for (const item of strip) {
        trackHtml += `<div class="mini-roulette-item">${imgTag(item)}</div>`;
        }

        roulettesHtml += `
        <div class="mini-roulette">
        <div class="mini-roulette-viewport">
        <div class="mini-roulette-pointer"></div>
        <div class="mini-roulette-track" id="mini-track-${idx}">${trackHtml}</div>
        </div>
        </div>
        `;
        configs.push({ idx });
        }

        rouletteRoot.innerHTML = `
        <div class="multi-roulette-container">
        <div class="multi-roulette-title">🎰 ${escapeHtml(caseName)} ×${count}</div>
        <div class="${listClass}">${roulettesHtml}</div>
        </div>
        `;

        setTimeout(() => {
        const ITEM_WIDTH = 64;
        for (const cfg of configs) {
        const track = document.getElementById(`mini-track-${cfg.idx}`);
        if (!track) continue;
        const viewport = track.parentElement;
        const viewportWidth = viewport.clientWidth;
        const pointerPos = viewportWidth / 2;
        const winningCenter = 30 * ITEM_WIDTH + ITEM_WIDTH / 2;
        const offset = winningCenter - pointerPos;
        const randomShift = (Math.random() - 0.5) * 40;
        const finalOffset = offset + randomShift;
        track.style.transform = `translateX(-${finalOffset}px)`;
        }
        }, 100);
        setTimeout(onDone, 4300);
        }

        function showMultiResult(results, caseId, count) {
        const rouletteRoot = document.getElementById("roulette-root");
        let listHtml = "";
        let totalValue = 0;
        for (const r of results) {
        totalValue += r.price;
        listHtml += `
        <div class="multi-result-row">
        <div class="m-img">${imgTag(r)}</div>
        <div class="multi-result-info">
        <div class="multi-result-name">${r.rarity} ${escapeHtml(r.name)}</div>
        <div class="multi-result-price">${formatNumber(r.price)}₽</div>
        </div>
        </div>
        `;
        }
        rouletteRoot.innerHTML = `
        <div class="result-container">
        <div class="result-header">🎁 Открыто ${count} кейсов</div>
        <div class="result-total">💰 Всего: ${formatNumber(totalValue)}₽</div>
        <div class="multi-result-list">${listHtml}</div>
        <div class="result-buttons">
        <button class="result-btn sell" onclick="sellAllResults(${JSON.stringify(results.map(r => r.code)).replace(/"/g, '&quot;')})">💵 Продать всё за ${formatNumber(totalValue)}₽</button>
        <button class="result-btn again" onclick="closeRoulette(); openCase('${caseId}', ${count})">🔁 Открыть ещё ×${count}</button>
        <button class="result-btn close" onclick="closeRoulette()">⬅️ К кейсам</button>
        </div>
        </div>
        `;
        }

        async function sellAllResults(codes) {
        if (!confirm(`💵 Продать всё за ${codes.length} предметов?`)) return;
        try {
        const res = await fetch(`${API_URL}/api/sell_bulk`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        body: JSON.stringify({ user_id: user.id, codes: codes })
        });
        const data = await res.json();
        if (data.ok) {
        updateBalance(data.new_balance);
        clearDynamicCache();
        closeRoulette();
        }
        else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
        }

        const ALL_DISH_NAMES = [
        "Крошка хлеба", "Кусок хлеба", "Гренка", "Варёное яйцо", "Овсянка",
        "Макароны", "Картошка", "Сосиска", "Салат из огурцов", "Помидор", "Лук", "Чеснок",
        "Вареники", "Сырники", "Драники", "Пельмени", "Блины", "Борщ", "Плов",
        "Котлета по-киевски", "Шаурма", "Гречка с мясом", "Куриный суп", "Окрошка",
        "Хачапури", "Чебурек", "Шашлык", "Суши", "Пицца", "Стейк", "Лазанья", "Паэлья",
        "Ризотто", "Рамен", "Бургер с трюфелем", "Хинкали", "Манты", "Том-ям",
        "Карпаччо", "Тартар из говядины", "Тирамису", "Фуа-гра", "Трюфель", "Крем-брюле",
        "Матча-десерт", "Крем-карамель", "Крокембуш", "Макарон", "Панна-котта",
        "Профитроли", "Мусс из манго", "Шоколадный фондан", "Хамон", "Пармезан 36 мес",
        "Вагю", "Мраморный тунец", "Кавиар", "Сыр с плесенью", "Осьминог", "Лобстер",
        "Краб камчатский", "Устрицы", "Икра морского ежа", "Рыба фуга", "Чёрная икра",
        "Белый трюфель", "Фугу", "Золотой стейк", "Блюдо шефа", "Легенда кухни",
        "Грааль гурмана", "Блюдо богов", "Абсолют", "Императорский ужин", "Блюдо царей",
        "Блюдо Олимпа", "Корона гурмана", "Пир богов", "Трон Олимпа", "Эликсир бессмертия",
        "Последний ужин", "Просфора", "Святая вода", "Деликатес из древности",

        "Кровь звездного кита", "Жареные семена Иггдрасиля", "Крылья пегаса BBQ",
        "Нектар падальщика", "Молния в бутылке", "Завтрашний суп", "Испуг сомнамбулы",
        "Грог", "Бесконечный бутерброд", "Блюдо из антиматерии", "Биткоин-бургер",
        ];

        const MAX_PRELOAD_TIME = 8000;

        function updatePreloaderProgress(done, total, status) {
        const percent = Math.round((done / total) * 100);
        document.getElementById("preloader-fill").style.width = percent + "%";
        document.getElementById("preloader-progress").textContent = percent + "%";
        if (status) document.getElementById("preloader-status").textContent = status;
        }

        function hidePreloader() {
        const preloader = document.getElementById("preloader");
        if (preloader) {
        preloader.classList.add("hidden");
        setTimeout(() => preloader.remove(), 600);
        }
        }

        async function preloadAllImages() {
        const total = ALL_DISH_NAMES.length;
        let done = 0;
        let loaded = 0;
        let failed = 0;
        const startTime = Date.now();
        const CONCURRENCY = 6;
        const queue = [...ALL_DISH_NAMES];

        async function loadOne(name) {
        return new Promise((resolve) => {
        const filename = name.toLowerCase().replace(/ /g, "_").replace(/ё/g, "е") + ".png";
        const url = `${API_URL}/images/${filename}`;
        const img = new Image();
        const timeout = setTimeout(() => {
        failed++; done++;
        updatePreloaderProgress(done, total, "Загрузка блюд...");
        resolve();
        }, 5000);
        img.onload = () => {
        clearTimeout(timeout);
        loaded++; done++;
        updatePreloaderProgress(done, total, "Загрузка блюд...");
        resolve();
        };
        img.onerror = () => {
        clearTimeout(timeout);
        failed++; done++;
        updatePreloaderProgress(done, total, "Загрузка блюд...");
        resolve();
        };
        img.src = url;
        });
        }

        async function worker() {
        while (queue.length > 0) {
        if (Date.now() - startTime > MAX_PRELOAD_TIME) return;
        const name = queue.shift();
        if (name) await loadOne(name);
        }
        }

        const workers = [];
        for (let i = 0; i < CONCURRENCY; i++) workers.push(worker());
        await Promise.all(workers);
        }

        async function initApp() {
        const startTime = Date.now();
        updatePreloaderProgress(0, 100, "Добро пожаловать!");
        await new Promise(r => setTimeout(r, 300));
        updatePreloaderProgress(0, 100, "Подготовка...");

        const profilePromise = user
        ? fetch(`${API_URL}/api/profile?user_id=${user.id}`, {
        headers: { "ngrok-skip-browser-warning": "true" }
        }).then(r => r.json()).catch(() => null)
        : Promise.resolve(null);

        const preloadPromise = preloadAllImages();

        const [profileResult] = await Promise.all([profilePromise, preloadPromise]);

        if (profileResult && profileResult.ok) {
            updateBalance(profileResult.user.balance);
            currentUserDiscount = profileResult.user.discount || 0;
            currentUserRep = profileResult.user.reputation || 0;
            currentUserPath = profileResult.user.path || "neutral";
            currentUserIsWorker = profileResult.user.is_worker || false;
        }

        updatePreloaderProgress(100, 100, "Готово!");
        await new Promise(r => setTimeout(r, 200));
        hidePreloader();
        switchTab("profile");
        startNotificationPolling();
        }

        initApp();
    </script>
