<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piggy Chef</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, Arial, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header .username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .tab.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-weight: bold;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card .label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 6px;
        }

        .card .value {
            font-size: 22px;
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .row .card {
            flex: 1;
            margin-bottom: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999);
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:active {
            opacity: 0.8;
        }

        /* ============================================================
           КАРТОЧКА ПРЕДМЕТА
           ============================================================ */
        .item {
            display: flex;
            flex-direction: column;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            position: relative;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            color: var(--tg-theme-text-color, #000);
        }

        .insured-badge {
            display: inline-block;
            background: #4a90e2;
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
            font-weight: normal;
        }

        .item-img {
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 0 auto 12px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .item-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .item-price {
            font-size: 16px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #000);
        }

        .item-code {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            font-family: monospace;
        }

        .item-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            flex: 1;
            height: 52px;
            font-size: 22px;
            padding: 0;
            margin: 0;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.1s;
        }

        .btn-small:active {
            transform: scale(0.95);
            opacity: 0.85;
        }

        .btn-insure { background: #4a90e2; }
        .btn-sell { background: #27ae60; }
        .btn-gift { background: #e67e22; }

        .btn-small.disabled {
            background: #555;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-small.disabled:active {
            transform: none;
            opacity: 0.5;
        }

        /* ============================================================
           МОДАЛЬНОЕ ОКНО ДЛЯ ПОДАРКА
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h3 {
            font-size: 18px;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
        }

        .modal-btn:active {
            opacity: 0.7;
        }

        .modal-btn.primary {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            text-align: center;
            font-weight: bold;
        }

        .modal-btn.cancel {
            background: #666;
            color: white;
            text-align: center;
            margin-top: 8px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .friend-username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 13px;
            margin-left: 6px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 10px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 12px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #2481cc);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🍽 Piggy Chef</h1>
    <div class="username" id="username">Загрузка...</div>
</div>

<div class="tabs">
    <button class="tab active" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
    <button class="tab" data-tab="inventory" onclick="switchTab('inventory')">🎒 Инвентарь</button>
</div>

<div id="content">
    <div class="loading">⏳ Загружаем данные...</div>
</div>

<div id="modal-root"></div>

<script>
    // ============================================================
    // НАСТРОЙКИ
    // ============================================================
    const API_URL = "https://preheated-playroom-detective.ngrok-free.dev";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function formatNumber(n) {
        if (!n) return "0";
        n = Number(n);
        if (n < 1000) return n.toString();
        if (n < 1000000) return (n / 1000).toFixed(1) + "K";
        if (n < 1000000000) return (n / 1000000).toFixed(1) + "M";
        if (n < 1000000000000) return (n / 1000000000).toFixed(1) + "B";
        if (n < 1000000000000000) return (n / 1000000000000).toFixed(1) + "T";
        return (n / 1000000000000000).toFixed(1) + "Qa";
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
    }

    // ============================================================
    // ВКЛАДКИ
    // ============================================================
    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-tab="${tab}"]`).classList.add("active");

        if (tab === "profile") loadProfile();
        if (tab === "inventory") loadInventory();
    }

    // ============================================================
    // ПРОФИЛЬ
    // ============================================================
    async function loadProfile() {
        if (!user) {
            document.getElementById("content").innerHTML =
                '<div class="error">❌ Открой меня внутри Telegram!</div>';
            return;
        }

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем данные...</div>';

        try {
            const res = await fetch(`${API_URL}/api/profile?user_id=${user.id}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            const u = data.user;
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="label">💰 Баланс</div>
                    <div class="value">${formatNumber(u.balance)}₽</div>
                </div>
                <div class="card">
                    <div class="label">✨ Опыт</div>
                    <div class="value">${formatNumber(u.xp)} XP</div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">🏪 Ресторан</div>
                        <div class="value">${u.restaurant_level} ур.</div>
                    </div>
                    <div class="card">
                        <div class="label">🔥 Стрик</div>
                        <div class="value">${u.streak} дн.</div>
                    </div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">📦 Кейсов</div>
                        <div class="value">${formatNumber(u.total_cases)}</div>
                    </div>
                    <div class="card">
                        <div class="label">⭐ Репутация</div>
                        <div class="value">${u.reputation}</div>
                    </div>
                </div>
                <button onclick="loadProfile()">🔄 Обновить</button>
            `;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    // ============================================================
    // ИНВЕНТАРЬ
    // ============================================================
    async function loadInventory() {
        if (!user) {
            document.getElementById("content").innerHTML =
                '<div class="error">❌ Открой меня внутри Telegram!</div>';
            return;
        }

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем инвентарь...</div>';

        try {
            const res = await fetch(`${API_URL}/api/inventory?user_id=${user.id}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            if (data.count === 0) {
                document.getElementById("content").innerHTML =
                    '<div class="card"><div class="label">🎒 Инвентарь пуст</div></div>';
                return;
            }

            let html = `<div class="card"><div class="label">🎒 Всего: ${data.count} предметов</div></div>`;

            for (const item of data.items) {
                const imgHtml = item.image
                    ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">`
                    : `<span>${item.rarity}</span>`;

                const insuredBadge = item.insured
                    ? '<span class="insured-badge">🛡 застрахован</span>'
                    : '';

                const insureBtn = item.insured
                    ? `<button class="btn-small btn-insure disabled" disabled>🛡</button>`
                    : `<button class="btn-small btn-insure" onclick="insureItem('${item.code}')">🛡</button>`;

                html += `
                    <div class="item">
                        <div class="item-name">
                            ${item.rarity} ${escapeHtml(item.name)}${insuredBadge}
                        </div>
                        <div class="item-img">${imgHtml}</div>
                        <div class="item-info">
                            <div class="item-price">${formatNumber(item.price)}₽</div>
                            <div class="item-code">${item.code}</div>
                        </div>
                        <div class="item-buttons">
                            ${insureBtn}
                            <button class="btn-small btn-sell" onclick="sellItem('${item.code}', ${item.price})">💵</button>
                            <button class="btn-small btn-gift" onclick="giftItem('${item.code}')">🎁</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById("content").innerHTML = html;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    // ============================================================
    // ДЕЙСТВИЯ
    // ============================================================
    async function insureItem(code) {
        if (!confirm("🛡 Застраховать предмет на 24 часа?\nСтоимость: 12% от цены.")) return;

        try {
            const res = await fetch(`${API_URL}/api/insure_item`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({
                    user_id: user.id,
                    item_code: code
                })
            });
            const data = await res.json();

            if (data.ok) {
                alert("✅ " + data.message);
                loadInventory();
            } else {
                alert("❌ " + data.error);
            }
        } catch (err) {
            alert("❌ Ошибка: " + err.message);
        }
    }

    async function sellItem(code, price) {
        if (!confirm(`💵 Продать за ${formatNumber(price)}₽?`)) return;

        try {
            const res = await fetch(`${API_URL}/api/sell_item`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({
                    user_id: user.id,
                    item_code: code
                })
            });
            const data = await res.json();

            if (data.ok) {
                alert("✅ " + data.message);
                loadInventory();
            } else {
                alert("❌ " + data.error);
            }
        } catch (err) {
            alert("❌ Ошибка: " + err.message);
        }
    }

    // ============================================================
    // ПОДАРОК — модальное окно с выбором
    // ============================================================
    function giftItem(code) {
        // Загружаем друзей
        fetch(`${API_URL}/api/friends?user_id=${user.id}`, {
            headers: { "ngrok-skip-browser-warning": "true" }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.ok) {
                alert("❌ " + data.error);
                return;
            }
            showGiftModal(code, data.friends || []);
        })
        .catch(err => {
            alert("❌ Ошибка: " + err.message);
        });
    }

    function showGiftModal(code, friends) {
        const modalRoot = document.getElementById("modal-root");

        let friendsHtml = "";
        if (friends.length === 0) {
            friendsHtml = '<div style="text-align:center;color:#999;padding:10px;">Нет друзей</div>';
        } else {
            for (const f of friends) {
                const displayName = f.first_name || f.username || `id${f.user_id}`;
                const uname = f.username ? `@${f.username}` : `id${f.user_id}`;
                friendsHtml += `
                    <button class="modal-btn" onclick="sendGift('${code}', ${f.user_id}, null)">
                        <div class="friend-item">
                            <span>${escapeHtml(displayName)}</span>
                            <span class="friend-username">${escapeHtml(uname)}</span>
                        </div>
                    </button>
                `;
            }
        }

        modalRoot.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
                <div class="modal">
                    <h3>🎁 Кому подарить?</h3>
                    <button class="modal-btn primary" onclick="showUsernameInput('${code}')">
                        ✏️ Ввести @username
                    </button>
                    <div style="margin-top:12px;margin-bottom:8px;font-size:13px;color:#999;text-align:center;">
                        или выбери из друзей:
                    </div>
                    ${friendsHtml}
                    <button class="modal-btn cancel" onclick="closeModal()">❌ Отмена</button>
                </div>
            </div>
        `;
    }

    function showUsernameInput(code) {
        const modalRoot = document.getElementById("modal-root");
        modalRoot.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
                <div class="modal">
                    <h3>🎁 Введи @username</h3>
                    <input type="text" id="gift-username-input" class="modal-input"
                           placeholder="@username или ID" autocomplete="off">
                    <button class="modal-btn primary" onclick="sendGiftByUsername('${code}')">
                        ✅ Отправить
                    </button>
                    <button class="modal-btn cancel" onclick="giftItem('${code}')">⬅️ Назад</button>
                </div>
            </div>
        `;
        setTimeout(() => document.getElementById("gift-username-input").focus(), 100);
    }

    function sendGiftByUsername(code) {
        const input = document.getElementById("gift-username-input");
        const value = input.value.trim().replace("@", "");
        if (!value) {
            alert("❌ Введи username или ID");
            return;
        }

        // Если цифры — это ID, иначе username
        const isId = /^\d+$/.test(value);
        if (isId) {
            sendGift(code, parseInt(value), null);
        } else {
            sendGift(code, null, value);
        }
    }

    async function sendGift(code, toUserId, toUsername) {
        closeModal();

        const body = {
            user_id: user.id,
            item_code: code
        };
        if (toUserId) body.to_user_id = toUserId;
        if (toUsername) body.to_username = toUsername;

        try {
            const res = await fetch(`${API_URL}/api/gift_item`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (data.ok) {
                alert("✅ " + data.message);
                loadInventory();
            } else {
                alert("❌ " + data.error);
            }
        } catch (err) {
            alert("❌ Ошибка: " + err.message);
        }
    }

    function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    switchTab("profile");
</script>

</body>
</html>
