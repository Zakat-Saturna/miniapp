<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        text-align: center;
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        background-color: var(--tg-theme-button-color, #2481cc);
        color: var(--tg-theme-button-text-color, #ffffff);
        border: none;
        border-radius: 10px;
    }
</style>
</head>
<body>
    <h1>Привет из Mini App!</h1>
    <p id="user">Загрузка...</p>
    <button onclick="send()">Отправить данные боту</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
        document.getElementById('user').textContent =
        `Привет, ${user.first_name}! Твой ID: ${user.id}`;
        } else {
        document.getElementById('user').textContent =
        'Открой меня внутри Telegram!';
        }

        function send() {
        if (!user) { alert('Открой меня в Telegram!'); return; }
        tg.sendData(JSON.stringify({ action: 'test', user_id: user.id }));
        tg.close();
        }
    </script>
</body>
</html>
