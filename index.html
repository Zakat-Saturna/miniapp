<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piggy Chef</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, Arial, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header .username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 14px;
        }

        .balance-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .balance-bar .balance {
            font-weight: bold;
            color: #27ae60;
            font-size: 17px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px 6px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .tab.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-weight: bold;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card .label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 6px;
        }

        .card .value {
            font-size: 22px;
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .row .card {
            flex: 1;
            margin-bottom: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999);
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:active {
            opacity: 0.8;
        }

        .item {
            display: flex;
            flex-direction: column;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            position: relative;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        .insured-badge {
            display: inline-block;
            background: #4a90e2;
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
            font-weight: normal;
        }

        .item-img {
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 0 auto 12px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .item-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .item-price {
            font-size: 16px;
            font-weight: bold;
        }

        .item-code {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            font-family: monospace;
        }

        .item-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            flex: 1;
            height: 52px;
            font-size: 22px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-small:active {
            transform: scale(0.95);
        }

        .btn-insure { background: #4a90e2; }
        .btn-sell { background: #27ae60; }
        .btn-gift { background: #e67e22; }

        .btn-small.disabled {
            background: #555;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .case-category {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
        }

        .case-category:active {
            opacity: 0.7;
        }

        .case-item {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            text-align: center;
        }

        .case-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .case-price {
            font-size: 15px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 12px;
        }

        .case-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-case {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-x1 { background: #3498db; }
        .btn-x3 { background: #9b59b6; }
        .btn-x10 { background: #e74c3c; }

        .btn-back {
            background: #666;
            color: white;
            margin-bottom: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h3 {
            font-size: 18px;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
        }

        .modal-btn.primary {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            text-align: center;
            font-weight: bold;
        }

        .modal-btn.cancel {
            background: #666;
            color: white;
            text-align: center;
            margin-top: 8px;
        }

        .friend-username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 13px;
            margin-left: 6px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 10px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 12px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #2481cc);
        }

        /* ============================================================
           АНИМАЦИЯ КЕЙСА (рулетка)
           ============================================================ */
        .roulette-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .roulette-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .roulette-viewport {
            width: 100%;
            max-width: 500px;
            height: 140px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-top: 3px solid #f1c40f;
            border-bottom: 3px solid #f1c40f;
            border-radius: 8px;
        }

        .roulette-track {
            display: flex;
            height: 100%;
            align-items: center;
            transition: transform 4s cubic-bezier(0.15, 0.7, 0.2, 1);
            will-change: transform;
        }

        .roulette-item {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            margin: 0 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .roulette-item img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .roulette-item .roulette-item-name {
            font-size: 10px;
            text-align: center;
            padding: 0 4px;
            margin-top: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #f1c40f;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 15px #f1c40f;
        }

        .roulette-pointer::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #f1c40f;
        }

        .roulette-pointer::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #f1c40f;
        }

        .result-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            text-align: center;
            overflow-y: auto;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
            margin-bottom: 16px;
        }

        .result-img {
            width: 160px;
            height: 160px;
            margin: 0 auto 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            overflow: hidden;
        }

        .result-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .result-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-price {
            font-size: 18px;
            color: #f1c40f;
            margin-bottom: 4px;
        }

        .result-xp {
            font-size: 14px;
            color: #9b59b6;
        }

        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }

        .result-btn {
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .result-btn.sell { background: #27ae60; }
        .result-btn.again { background: #3498db; }
        .result-btn.close { background: #666; }

        .multi-result-list {
            max-height: 50vh;
            overflow-y: auto;
            width: 100%;
            max-width: 400px;
            margin-bottom: 16px;
        }

        .multi-result-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }

        .multi-result-row img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .multi-result-info {
            flex: 1;
            text-align: left;
        }

        .multi-result-name {
            font-size: 14px;
            font-weight: bold;
        }

        .multi-result-price {
            font-size: 12px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🍽 Piggy Chef</h1>
    <div class="username" id="username">Загрузка...</div>
</div>

<div class="balance-bar">
    <span>💰 Баланс:</span>
    <span class="balance" id="balance-display">...</span>
</div>

<div class="tabs">
    <button class="tab active" data-tab="profile" onclick="switchTab('profile')">👤</button>
    <button class="tab" data-tab="inventory" onclick="switchTab('inventory')">🎒</button>
    <button class="tab" data-tab="cases" onclick="switchTab('cases')">📦</button>
</div>

<div id="content">
    <div class="loading">⏳ Загружаем данные...</div>
</div>

<div id="modal-root"></div>
<div id="roulette-root"></div>

<script>
    // ============================================================
    // НАСТРОЙКИ
    // ============================================================
    const API_URL = "https://preheated-playroom-detective.ngrok-free.dev";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    let currentBalance = 0;
    let casesData = null;

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function formatNumber(n) {
        if (!n) return "0";
        n = Number(n);
        if (n < 1000) return n.toString();
        if (n < 1000000) return (n / 1000).toFixed(1) + "K";
        if (n < 1000000000) return (n / 1000000).toFixed(1) + "M";
        if (n < 1000000000000) return (n / 1000000000).toFixed(1) + "B";
        if (n < 1000000000000000) return (n / 1000000000000).toFixed(1) + "T";
        return (n / 1000000000000000).toFixed(1) + "Qa";
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
    }

    function updateBalance(b) {
        currentBalance = b;
        document.getElementById("balance-display").textContent = formatNumber(b) + "₽";
    }

    // ============================================================
    // ВКЛАДКИ
    // ============================================================
    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-tab="${tab}"]`).classList.add("active");

        if (tab === "profile") loadProfile();
        if (tab === "inventory") loadInventory();
        if (tab === "cases") loadCases();
    }

    // ============================================================
    // ПРОФИЛЬ
    // ============================================================
    async function loadProfile() {
        if (!user) {
            document.getElementById("content").innerHTML =
                '<div class="error">❌ Открой меня внутри Telegram!</div>';
            return;
        }

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем данные...</div>';

        try {
            const res = await fetch(`${API_URL}/api/profile?user_id=${user.id}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            const u = data.user;
            updateBalance(u.balance);

            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="label">💰 Баланс</div>
                    <div class="value">${formatNumber(u.balance)}₽</div>
                </div>
                <div class="card">
                    <div class="label">✨ Опыт</div>
                    <div class="value">${formatNumber(u.xp)} XP</div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">🏪 Ресторан</div>
                        <div class="value">${u.restaurant_level} ур.</div>
                    </div>
                    <div class="card">
                        <div class="label">🔥 Стрик</div>
                        <div class="value">${u.streak} дн.</div>
                    </div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">📦 Кейсов</div>
                        <div class="value">${formatNumber(u.total_cases)}</div>
                    </div>
                    <div class="card">
                        <div class="label">⭐ Репутация</div>
                        <div class="value">${u.reputation}</div>
                    </div>
                </div>
                <button onclick="loadProfile()">🔄 Обновить</button>
            `;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    // ============================================================
    // ИНВЕНТАРЬ
    // ============================================================
    async function loadInventory() {
        if (!user) return;

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем инвентарь...</div>';

        try {
            const res = await fetch(`${API_URL}/api/inventory?user_id=${user.id}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            if (data.count === 0) {
                document.getElementById("content").innerHTML =
                    '<div class="card"><div class="label">🎒 Инвентарь пуст</div></div>';
                return;
            }

            let html = `<div class="card"><div class="label">🎒 Всего: ${data.count} предметов</div></div>`;

            for (const item of data.items) {
                const imgHtml = item.image
                    ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">`
                    : `<span>${item.rarity}</span>`;

                const insuredBadge = item.insured
                    ? '<span class="insured-badge">🛡 застрахован</span>'
                    : '';

                const insureBtn = item.insured
                    ? `<button class="btn-small btn-insure disabled" disabled>🛡</button>`
                    : `<button class="btn-small btn-insure" onclick="insureItem('${item.code}')">🛡</button>`;

                html += `
                    <div class="item">
                        <div class="item-name">
                            ${item.rarity} ${escapeHtml(item.name)}${insuredBadge}
                        </div>
                        <div class="item-img">${imgHtml}</div>
                        <div class="item-info">
                            <div class="item-price">${formatNumber(item.price)}₽</div>
                            <div class="item-code">${item.code}</div>
                        </div>
                        <div class="item-buttons">
                            ${insureBtn}
                            <button class="btn-small btn-sell" onclick="sellItem('${item.code}', ${item.price})">💵</button>
                            <button class="btn-small btn-gift" onclick="giftItem('${item.code}')">🎁</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById("content").innerHTML = html;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    // ============================================================
    // ДЕЙСТВИЯ
    // ============================================================
    async function insureItem(code) {
        if (!confirm("🛡 Застраховать предмет на 24 часа?\nСтоимость: 12% от цены.")) return;
        try {
            const res = await fetch(`${API_URL}/api/insure_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, item_code: code })
            });
            const data = await res.json();
            if (data.ok) {
                alert("✅ " + data.message);
                if (data.new_balance !== undefined) updateBalance(data.new_balance);
                loadInventory();
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    async function sellItem(code, price) {
        if (!confirm(`💵 Продать за ${formatNumber(price)}₽?`)) return;
        try {
            const res = await fetch(`${API_URL}/api/sell_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, item_code: code })
            });
            const data = await res.json();
            if (data.ok) {
                alert("✅ " + data.message);
                if (data.new_balance !== undefined) updateBalance(data.new_balance);
                loadInventory();
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    // ============================================================
    // ПОДАРОК
    // ============================================================
    function giftItem(code) {
        fetch(`${API_URL}/api/friends?user_id=${user.id}`, {
            headers: { "ngrok-skip-browser-warning": "true" }
        })
        .then(r => r.json())
        .then(data => {
            if (!data.ok) { alert("❌ " + data.error); return; }
            showGiftModal(code, data.friends || []);
        })
        .catch(err => alert("❌ Ошибка: " + err.message));
    }

    function showGiftModal(code, friends) {
        const modalRoot = document.getElementById("modal-root");
        let friendsHtml = "";
        if (friends.length === 0) {
            friendsHtml = '<div style="text-align:center;color:#999;padding:10px;">Нет друзей</div>';
        } else {
            for (const f of friends) {
                const displayName = f.first_name || f.username || `id${f.user_id}`;
                const uname = f.username ? `@${f.username}` : `id${f.user_id}`;
                friendsHtml += `
                    <button class="modal-btn" onclick="sendGift('${code}', ${f.user_id}, null)">
                        ${escapeHtml(displayName)}<span class="friend-username">${escapeHtml(uname)}</span>
                    </button>
                `;
            }
        }

        modalRoot.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
                <div class="modal">
                    <h3>🎁 Кому подарить?</h3>
                    <button class="modal-btn primary" onclick="showUsernameInput('${code}')">✏️ Ввести @username</button>
                    <div style="margin-top:12px;margin-bottom:8px;font-size:13px;color:#999;text-align:center;">или выбери из друзей:</div>
                    ${friendsHtml}
                    <button class="modal-btn cancel" onclick="closeModal()">❌ Отмена</button>
                </div>
            </div>
        `;
    }

    function showUsernameInput(code) {
        const modalRoot = document.getElementById("modal-root");
        modalRoot.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
                <div class="modal">
                    <h3>🎁 Введи @username</h3>
                    <input type="text" id="gift-username-input" class="modal-input" placeholder="@username или ID" autocomplete="off">
                    <button class="modal-btn primary" onclick="sendGiftByUsername('${code}')">✅ Отправить</button>
                    <button class="modal-btn cancel" onclick="giftItem('${code}')">⬅️ Назад</button>
                </div>
            </div>
        `;
        setTimeout(() => document.getElementById("gift-username-input").focus(), 100);
    }

    function sendGiftByUsername(code) {
        const input = document.getElementById("gift-username-input");
        const value = input.value.trim().replace("@", "");
        if (!value) { alert("❌ Введи username или ID"); return; }
        const isId = /^\d+$/.test(value);
        if (isId) sendGift(code, parseInt(value), null);
        else sendGift(code, null, value);
    }

    async function sendGift(code, toUserId, toUsername) {
        closeModal();
        const body = { user_id: user.id, item_code: code };
        if (toUserId) body.to_user_id = toUserId;
        if (toUsername) body.to_username = toUsername;

        try {
            const res = await fetch(`${API_URL}/api/gift_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.ok) {
                alert("✅ " + data.message);
                loadInventory();
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
    }

    // ============================================================
    // КЕЙСЫ
    // ============================================================
    async function loadCases() {
        if (!user) return;

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем кейсы...</div>';

        try {
            const res = await fetch(`${API_URL}/api/cases`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            casesData = data.categories;
            renderCategories();
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    function renderCategories() {
        let html = '<div class="card"><div class="label">📦 Выбери категорию</div></div>';
        for (const cat of casesData) {
            html += `
                <div class="case-category" onclick="renderCaseList('${cat.id}')">
                    <span>${escapeHtml(cat.name)}</span>
                    <span>▶️</span>
                </div>
            `;
        }
        document.getElementById("content").innerHTML = html;
    }

    function renderCaseList(catId) {
        const cat = casesData.find(c => c.id === catId);
        if (!cat) return;

        let html = `<button class="btn-back" onclick="renderCategories()">⬅️ Назад к категориям</button>`;
        html += `<div class="card"><div class="label">${escapeHtml(cat.name)}</div></div>`;

        for (const c of cat.cases) {
            html += `
                <div class="case-item">
                    <div class="case-name">${escapeHtml(c.name)}</div>
                    <div class="case-price">${formatNumber(c.price)}₽</div>
                    <div class="case-buttons">
                        <button class="btn-case btn-x1" onclick="openCase('${c.id}', 1)">×1</button>
                        <button class="btn-case btn-x3" onclick="openCase('${c.id}', 3)">×3</button>
                        <button class="btn-case btn-x10" onclick="openCase('${c.id}', 10)">×10</button>
                    </div>
                </div>
            `;
        }
        document.getElementById("content").innerHTML = html;
    }

    // ============================================================
    // ОТКРЫТИЕ КЕЙСА + АНИМАЦИЯ
    // ============================================================
    function openCase(caseId, count) {
        if (!user) return;

        // Находим цену
        let casePrice = 0;
        let caseName = "";
        for (const cat of casesData) {
            for (const c of cat.cases) {
                if (c.id === caseId) {
                    casePrice = c.price;
                    caseName = c.name;
                    break;
                }
            }
        }

        const total = casePrice * count;
        if (currentBalance < total) {
            alert(`❌ Нужно ${formatNumber(total)}₽, у тебя ${formatNumber(currentBalance)}₽`);
            return;
        }

        showRouletteAnimation(caseName, count);
        doOpenCase(caseId, count);
    }

    async function doOpenCase(caseId, count) {
        try {
            const res = await fetch(`${API_URL}/api/open_case`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, case_id: caseId, count })
            });
            const data = await res.json();

            if (!data.ok) {
                closeRoulette();
                alert("❌ " + data.error);
                return;
            }

            updateBalance(data.new_balance);

            // Показываем результат после анимации (4 сек)
            setTimeout(() => {
                closeRoulette();
                showResult(data.results, caseId, count);
            }, 4000);
        } catch (err) {
            closeRoulette();
            alert("❌ Ошибка: " + err.message);
        }
    }

    function showRouletteAnimation(caseName, count) {
        const rouletteRoot = document.getElementById("roulette-root");

        // Твои 8 редкостей
        const emojis = ["⚪", "🟢", "🔵", "🟣", "🟡", "🔴", "🔶", "🔷"];
        const items = [];
        for (let i = 0; i < 50; i++) {
            items.push(emojis[Math.floor(Math.random() * emojis.length)]);
        }

        let trackHtml = "";
        for (const e of items) {
            trackHtml += `<div class="roulette-item">${e}</div>`;
        }

        rouletteRoot.innerHTML = `
            <div class="roulette-container">
                <div class="roulette-title">🎰 ${escapeHtml(caseName)} ×${count}</div>
                <div class="roulette-viewport">
                    <div class="roulette-pointer"></div>
                    <div class="roulette-track" id="roulette-track">
                        ${trackHtml}
                    </div>
                </div>
            </div>
        `;

        setTimeout(() => {
            const track = document.getElementById("roulette-track");
            if (!track) return;
            const distance = 2500 + Math.random() * 800;
            track.style.transform = `translateX(-${distance}px)`;
        }, 100);
    }

    function closeRoulette() {
        document.getElementById("roulette-root").innerHTML = "";
    }

    // ============================================================
    // РЕЗУЛЬТАТ
    // ============================================================
    function showResult(results, caseId, count) {
        const rouletteRoot = document.getElementById("roulette-root");

        if (count === 1) {
            const r = results[0];
            const imgHtml = r.image
                ? `<img src="${r.image}" alt="${escapeHtml(r.name)}">`
                : `<span>${r.rarity}</span>`;

            rouletteRoot.innerHTML = `
                <div class="result-container">
                    <div class="result-item">
                        <div class="result-img">${imgHtml}</div>
                        <div class="result-name">${r.rarity} ${escapeHtml(r.name)}</div>
                        <div class="result-price">💰 ${formatNumber(r.price)}₽</div>
                        <div class="result-xp">✨ +${r.xp} XP</div>
                    </div>
                    <div class="result-buttons">
                        <button class="result-btn sell" onclick="quickSellResult('${r.code}', ${r.price})">💵 Продать за ${formatNumber(r.price)}₽</button>
                        <button class="result-btn again" onclick="closeRoulette(); openCase('${caseId}', 1)">🔁 Открыть ещё ×1</button>
                        <button class="result-btn close" onclick="closeRoulette()">⬅️ К кейсам</button>
                    </div>
                </div>
            `;
        } else {
            let listHtml = "";
            let totalValue = 0;
            for (const r of results) {
                totalValue += r.price;
                const imgHtml = r.image
                    ? `<img src="${r.image}">`
                    : `<span>${r.rarity}</span>`;
                listHtml += `
                    <div class="multi-result-row">
                        <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:24px;">${imgHtml}</div>
                        <div class="multi-result-info">
                            <div class="multi-result-name">${r.rarity} ${escapeHtml(r.name)}</div>
                            <div class="multi-result-price">${formatNumber(r.price)}₽</div>
                        </div>
                    </div>
                `;
            }

            rouletteRoot.innerHTML = `
                <div class="result-container">
                    <div style="font-size:18px;font-weight:bold;margin-bottom:12px;">
                        Открыто ${count} кейсов на ${formatNumber(totalValue)}₽
                    </div>
                    <div class="multi-result-list">
                        ${listHtml}
                    </div>
                    <div class="result-buttons">
                        <button class="result-btn again" onclick="closeRoulette(); openCase('${caseId}', ${count})">🔁 Открыть ещё ×${count}</button>
                        <button class="result-btn close" onclick="closeRoulette()">⬅️ К кейсам</button>
                    </div>
                </div>
            `;
        }
    }

    async function quickSellResult(code, price) {
        try {
            const res = await fetch(`${API_URL}/api/sell_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                body: JSON.stringify({ user_id: user.id, item_code: code })
            });
            const data = await res.json();
            if (data.ok) {
                updateBalance(data.new_balance);
                closeRoulette();
                alert("✅ Продано за " + formatNumber(price) + "₽");
                loadCases();
            } else alert("❌ " + data.error);
        } catch (err) { alert("❌ Ошибка: " + err.message); }
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    switchTab("profile");
</script>

</body>
</html>
