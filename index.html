<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piggy Chef</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, Arial, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header .username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 14px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card .label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 6px;
        }

        .card .value {
            font-size: 22px;
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .row .card {
            flex: 1;
            margin-bottom: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999);
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:active { opacity: 0.8; }
    </style>
</head>
<body>

<div class="header">
    <h1>🍽 Piggy Chef</h1>
    <div class="username" id="username">Загрузка...</div>
</div>

<div id="content">
    <div class="loading">⏳ Загружаем данные...</div>
</div>

<script>
    // ============================================================
    // НАСТРОЙКИ
    // ============================================================
    const API_URL = "https://preheated-playroom-detective.ngrok-free.dev";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function formatNumber(n) {
        if (!n) return "0";
        n = Number(n);
        if (n < 1000) return n.toString();
        if (n < 1000000) return (n / 1000).toFixed(1) + "K";
        if (n < 1000000000) return (n / 1000000).toFixed(1) + "M";
        if (n < 1000000000000) return (n / 1000000000).toFixed(1) + "B";
        if (n < 1000000000000000) return (n / 1000000000000).toFixed(1) + "T";
        return (n / 1000000000000000).toFixed(1) + "Qa";
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
    }

    // ============================================================
    // ЗАГРУЗКА ПРОФИЛЯ
    // ============================================================
    async function loadProfile() {
        if (!user) {
            document.getElementById("content").innerHTML =
                '<div class="error">❌ Открой меня внутри Telegram!</div>';
            return;
        }

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;

        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем данные...</div>';

        try {
           const res = await fetch(`${API_URL}/api/profile?user_id=${user.id}`);

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }

            const data = await res.json();

            if (!data.ok) {
                document.getElementById("content").innerHTML =
                    `<div class="error">❌ ${escapeHtml(data.error)}</div>`;
                return;
            }

            const u = data.user;

            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="label">💰 Баланс</div>
                    <div class="value">${formatNumber(u.balance)}₽</div>
                </div>

                <div class="card">
                    <div class="label">✨ Опыт</div>
                    <div class="value">${formatNumber(u.xp)} XP</div>
                </div>

                <div class="row">
                    <div class="card">
                        <div class="label">🏪 Ресторан</div>
                        <div class="value">${u.restaurant_level} ур.</div>
                    </div>
                    <div class="card">
                        <div class="label">🔥 Стрик</div>
                        <div class="value">${u.streak} дн.</div>
                    </div>
                </div>

                <div class="row">
                    <div class="card">
                        <div class="label">📦 Кейсов</div>
                        <div class="value">${formatNumber(u.total_cases)}</div>
                    </div>
                    <div class="card">
                        <div class="label">⭐ Репутация</div>
                        <div class="value">${u.reputation}</div>
                    </div>
                </div>

                <button onclick="loadProfile()">🔄 Обновить</button>
            `;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>
                 <button onclick="loadProfile()">🔄 Попробовать снова</button>`;
        }
    }

    // Запуск
    loadProfile();
</script>

</body>
</html>
