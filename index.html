<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piggy Chef</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, Arial, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header .username {
            color: var(--tg-theme-hint-color, #999);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .tab.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-weight: bold;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card .label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 6px;
        }

        .card .value {
            font-size: 22px;
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .row .card {
            flex: 1;
            margin-bottom: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999);
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .success {
            background: #27ae60;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:active {
            opacity: 0.8;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .item-img {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-price {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999);
        }

        .item-code {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #999);
            font-family: monospace;
        }

        .item-buttons {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-small {
            width: 36px;
            height: 32px;
            font-size: 14px;
            padding: 0;
            margin: 0;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .btn-insure { background: #4a90e2; }
        .btn-sell { background: #27ae60; }
        .btn-gift { background: #e67e22; }
    </style>
</head>
<body>

<div class="header">
    <h1>🍽 Piggy Chef</h1>
    <div class="username" id="username">Загрузка...</div>
</div>

<div class="tabs">
    <button class="tab active" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
    <button class="tab" data-tab="inventory" onclick="switchTab('inventory')">🎒 Инвентарь</button>
</div>

<div id="content">
    <div class="loading">⏳ Загружаем данные...</div>
</div>

<script>
    // ============================================================
    // НАСТРОЙКИ
    // ============================================================
    const API_URL = "https://preheated-playroom-detective.ngrok-free.dev";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    // ============================================================
    // УТИЛИТЫ
    // ============================================================
    function formatNumber(n) {
        if (!n) return "0";
        n = Number(n);
        if (n < 1000) return n.toString();
        if (n < 1000000) return (n / 1000).toFixed(1) + "K";
        if (n < 1000000000) return (n / 1000000).toFixed(1) + "M";
        if (n < 1000000000000) return (n / 1000000000).toFixed(1) + "B";
        if (n < 1000000000000000) return (n / 1000000000000).toFixed(1) + "T";
        return (n / 1000000000000000).toFixed(1) + "Qa";
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
    }

    // ============================================================
    // ВКЛАДКИ
    // ============================================================
    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-tab="${tab}"]`).classList.add("active");

        if (tab === "profile") loadProfile();
        if (tab === "inventory") loadInventory();
    }

    // ============================================================
    // ПРОФИЛЬ
    // ============================================================
    async function loadProfile() {
        if (!user) {
            document.getElementById("content").innerHTML =
                '<div class="error">❌ Открой меня внутри Telegram!</div>';
            return;
        }

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем данные...</div>';

        try {
            const res = await fetch(`${API_URL}/api/profile?user_id=${user.id}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            const u = data.user;
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="label">💰 Баланс</div>
                    <div class="value">${formatNumber(u.balance)}₽</div>
                </div>
                <div class="card">
                    <div class="label">✨ Опыт</div>
                    <div class="value">${formatNumber(u.xp)} XP</div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">🏪 Ресторан</div>
                        <div class="value">${u.restaurant_level} ур.</div>
                    </div>
                    <div class="card">
                        <div class="label">🔥 Стрик</div>
                        <div class="value">${u.streak} дн.</div>
                    </div>
                </div>
                <div class="row">
                    <div class="card">
                        <div class="label">📦 Кейсов</div>
                        <div class="value">${formatNumber(u.total_cases)}</div>
                    </div>
                    <div class="card">
                        <div class="label">⭐ Репутация</div>
                        <div class="value">${u.reputation}</div>
                    </div>
                </div>
                <button onclick="loadProfile()">🔄 Обновить</button>
            `;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    // ============================================================
    // ИНВЕНТАРЬ
    // ============================================================
    async function loadInventory() {
        if (!user) {
            document.getElementById("content").innerHTML =
                '<div class="error">❌ Открой меня внутри Telegram!</div>';
            return;
        }

        document.getElementById("username").textContent =
            `${user.first_name} (@${user.username || "no_username"})`;
        document.getElementById("content").innerHTML =
            '<div class="loading">⏳ Загружаем инвентарь...</div>';

        try {
            const res = await fetch(`${API_URL}/api/inventory?user_id=${user.id}`, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);

            if (data.count === 0) {
                document.getElementById("content").innerHTML =
                    '<div class="card"><div class="label">🎒 Инвентарь пуст</div></div>';
                return;
            }

            let html = `<div class="card"><div class="label">🎒 Всего: ${data.count} предметов</div></div>`;

            for (const item of data.items) {
                const imgHtml = item.image
                    ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">`
                    : `<span>${item.rarity}</span>`;

                html += `
                    <div class="item">
                        <div class="item-img">${imgHtml}</div>
                        <div class="item-info">
                            <div class="item-name">${item.rarity} ${escapeHtml(item.name)}</div>
                            <div class="item-price">${formatNumber(item.price)}₽</div>
                            <div class="item-code">${item.code}</div>
                        </div>
                        <div class="item-buttons">
                            <button class="btn-small btn-insure" onclick="insureItem('${item.code}')">🛡</button>
                            <button class="btn-small btn-sell" onclick="sellItem('${item.code}', ${item.price})">💵</button>
                            <button class="btn-small btn-gift" onclick="giftItem('${item.code}')">🎁</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById("content").innerHTML = html;
        } catch (err) {
            document.getElementById("content").innerHTML =
                `<div class="error">❌ Ошибка: ${escapeHtml(err.message)}</div>`;
        }
    }

    // ============================================================
    // ДЕЙСТВИЯ
    // ============================================================
    async function insureItem(code) {
        if (!confirm("🛡 Застраховать предмет на 24 часа?\nСтоимость: 12% от цены.")) return;

        try {
            const res = await fetch(`${API_URL}/api/insure_item`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({
                    user_id: user.id,
                    item_code: code
                })
            });
            const data = await res.json();

            if (data.ok) {
                alert("✅ " + data.message);
                loadInventory();
            } else {
                alert("❌ " + data.error);
            }
        } catch (err) {
            alert("❌ Ошибка: " + err.message);
        }
    }

    async function sellItem(code, price) {
        if (!confirm(`💵 Продать за ${formatNumber(price)}₽?`)) return;

        try {
            const res = await fetch(`${API_URL}/api/sell_item`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({
                    user_id: user.id,
                    item_code: code
                })
            });
            const data = await res.json();

            if (data.ok) {
                alert("✅ " + data.message);
                loadInventory();
            } else {
                alert("❌ " + data.error);
            }
        } catch (err) {
            alert("❌ Ошибка: " + err.message);
        }
    }

    async function giftItem(code) {
        const toUserId = prompt("🎁 Введи ID игрока, которому подарить:");
        if (!toUserId) return;

        const toId = parseInt(toUserId);
        if (!toId || isNaN(toId)) {
            alert("❌ Неверный ID");
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/gift_item`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({
                    user_id: user.id,
                    item_code: code,
                    to_user_id: toId
                })
            });
            const data = await res.json();

            if (data.ok) {
                alert("✅ " + data.message);
                loadInventory();
            } else {
                alert("❌ " + data.error);
            }
        } catch (err) {
            alert("❌ Ошибка: " + err.message);
        }
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    switchTab("profile");
</script>

</body>
</html>
